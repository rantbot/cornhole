<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>shake it loose</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0a0a0a; color: #777;
    font: 700 20px/1.2 -apple-system, system-ui, sans-serif;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    display: flex; align-items: center; justify-content: center;
    transition: background .05s linear;
  }
  body.impact { background: #2962ff; color: #fff; }
  body.hit    { background: #00c853; color: #000; }
  body.fail   { background: #b71c1c; color: #fff; }
  #word { font-size: 17vw; font-weight: 800; letter-spacing: -.03em; text-align: center; z-index: 2; }
  #sub  { position: fixed; bottom: 11vh; left: 0; right: 0; text-align: center; font-size: 4.5vw; z-index: 2; }
  #score{ position: fixed; top: calc(2vh + env(safe-area-inset-top)); left: 0; right: 0;
          text-align: center; font-size: 4vw; opacity: .55; z-index: 2; }
  #spot { position: fixed; border: 6px solid #fff; border-radius: 50%;
          transform: translate(-50%,-50%); display: none; z-index: 1; }
  #buzz { position: fixed; bottom: 0; left: 0; right: 0; z-index: 3;
          padding: 16px 0 calc(16px + env(safe-area-inset-bottom));
          background: #1c1c1c; color: #ddd; border: 0; border-top: 1px solid #333;
          font: 700 17px -apple-system, system-ui, sans-serif; }
</style>
</head>
<body>
  <div id="spot"></div>
  <div id="word">tap to arm</div>
  <div id="sub"></div>
  <div id="score"></div>
  <button id="buzz">buzz now</button>

<script>
(function(){
"use strict";
var $ = function(i){ return document.getElementById(i); };
var armed = false, ctx = null;
var thrown = 0, read = 0;
var waiting = false, waitTimer = null, lastImpact = -1e9;
var accThr = 0.7, cal = [], calEnd = 0;

function beep(f, ms){
  if (!ctx) return;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "square"; o.frequency.value = f; g.gain.value = .25;
  o.connect(g); g.connect(ctx.destination); o.start();
  g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + ms/1000);
  o.stop(ctx.currentTime + ms/1000);
}

/* The whole point. Shake the phone so a resting packet looks like a moving
   contact instead of baseline drift. Android only, Safari ignores vibrate. */
function shake(){
  if (navigator.vibrate) navigator.vibrate([45,35,45,35,45,35,60]);
}

function say(cls, big, small){
  document.body.className = cls;
  $("word").textContent = big;
  $("word").style.fontSize = big.length > 6 ? "11vw" : "17vw";
  $("sub").textContent = small || "";
}
function idle(){
  waiting = false;
  say("", "throw", "");
  $("word").style.fontSize = "10vw";
  $("spot").style.display = "none";
}
function tally(){ $("score").textContent = read + " read / " + thrown + " thrown"; }

/* ---- impact ---- */
function onImpact(mag){
  var t = performance.now();
  if (t - lastImpact < 900) return;
  lastImpact = t;
  thrown++; tally();
  waiting = true;
  say("impact", "BUZZ", "impact " + mag.toFixed(1) + " m/s2");
  beep(440, 80);
  shake();
  setTimeout(shake, 320);
  setTimeout(shake, 640);
  clearTimeout(waitTimer);
  waitTimer = setTimeout(function(){
    if (!waiting) return;
    say("fail", "NO READ", "buzzing did not shake it loose");
    beep(160, 250);
    setTimeout(idle, 2200);
  }, 1400);
}

function motion(ax, ay, az){
  var m = Math.hypot(ax, ay, az);
  var t = performance.now();
  if (t < calEnd) { cal.push(m); return; }
  if (cal.length) {
    var mx = 0; for (var i=0;i<cal.length;i++) if (cal[i] > mx) mx = cal[i];
    accThr = Math.max(0.25, mx * 3.5); cal = [];
    $("sub").textContent = "impact trigger " + accThr.toFixed(2) + " m/s2";
  }
  if (m > accThr) onImpact(m);
}

function startMotion(){
  if (window.LinearAccelerationSensor) {
    try {
      var a = new LinearAccelerationSensor({frequency:200});
      a.onreading = function(){ motion(a.x, a.y, a.z); };
      a.onerror = dm; a.start();
      calEnd = performance.now() + 1500;
      return;
    } catch(e){}
  }
  dm();
}
function dm(){
  function bind(){
    calEnd = performance.now() + 1500;
    addEventListener("devicemotion", function(e){
      var a = e.acceleration;
      if (!a || a.x === null) return;
      motion(a.x||0, a.y||0, a.z||0);
    });
  }
  if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission)
    DeviceMotionEvent.requestPermission().then(bind).catch(function(){});
  else bind();
}

/* ---- touch ---- */
document.addEventListener("touchstart", function(e){
  if (e.target.id === "buzz") return;
  e.preventDefault();
  if (!armed) {
    armed = true;
    try { ctx = new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); } catch(err){}
    startMotion();
    idle();
    if (!navigator.vibrate) $("sub").textContent = "no vibrate api on this browser";
    tally();
    return;
  }
  var t = e.changedTouches[0];
  var r = Math.max(t.radiusX||0, t.radiusY||0);
  if (waiting) { waiting = false; clearTimeout(waitTimer); read++; tally(); }
  say("hit", "YES",
      Math.round(t.clientX/innerWidth*100) + "%  " +
      Math.round(t.clientY/innerHeight*100) + "%" + (r ? "   size " + Math.round(r) : ""));
  var s = $("spot"), d = Math.max(70, r*2);
  s.style.cssText = "left:"+t.clientX+"px;top:"+t.clientY+"px;width:"+d+"px;height:"+d+"px;display:block";
  beep(880, 110);
}, {passive:false});

document.addEventListener("touchend", function(e){
  if (e.target.id === "buzz") return;
  e.preventDefault();
  if (document.body.className === "hit") setTimeout(idle, 1200);
}, {passive:false});

/* manual buzz, so you can place a packet by hand and isolate the variable */
$("buzz").addEventListener("click", function(e){
  e.stopPropagation();
  shake(); beep(440, 60);
});
})();
</script>
</body>
</html>
