<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>on or off</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0a0a0a; color: #777;
    font: 700 20px/1.2 -apple-system, system-ui, sans-serif;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    display: flex; align-items: center; justify-content: center;
    transition: background .05s linear;
  }
  body.settle { background: #2962ff; color: #fff; }
  body.win    { background: #00c853; color: #000; }
  body.lose   { background: #c62828; color: #fff; }
  #word { font-size: 24vw; font-weight: 800; letter-spacing: -.04em; text-align: center; z-index: 2; }
  #sub  { position: fixed; bottom: 13vh; left: 0; right: 0; text-align: center; font-size: 4.5vw; z-index: 2; }
  #score{ position: fixed; top: calc(2vh + env(safe-area-inset-top)); left: 0; right: 0;
          text-align: center; font-size: 4.2vw; opacity: .6; z-index: 2; }
  #spot { position: fixed; border: 6px solid #fff; border-radius: 50%;
          transform: translate(-50%,-50%); display: none; z-index: 1; }
  #bar  { position: fixed; bottom: 0; left: 0; right: 0; z-index: 3; display: flex; gap: 1px;
          background: #333; border-top: 1px solid #333; }
  #bar button { flex: 1; padding: 14px 0 calc(14px + env(safe-area-inset-bottom));
                background: #1a1a1a; color: #999; border: 0;
                font: 600 15px -apple-system, system-ui, sans-serif; }
</style>
</head>
<body>
  <div id="spot"></div>
  <div id="word">tap to arm</div>
  <div id="sub"></div>
  <div id="score"></div>
  <div id="bar">
    <button id="bBuzz">buzz</button>
    <button id="bReset">reset score</button>
  </div>

<script>
(function(){
"use strict";
var $ = function(i){ return document.getElementById(i); };

var armed = false, ctx = null;
var wins = 0, plays = 0;
var phase = "cold";              // cold | ready | settle | done
var lastImpact = -1e9, timers = [];
var touching = false, lastPos = null;
var accThr = 0.7, cal = [], calEnd = 0;

/* how long to let the packet settle before calling it */
var BUZZES = [40, 340, 640, 1450];
var VERDICT_AT = 1950;
var HOLD_MS = 2600;              // lockout so picking it up is not a new throw

function beep(f, ms, type){
  if (!ctx) return;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || "square"; o.frequency.value = f; g.gain.value = .25;
  o.connect(g); g.connect(ctx.destination); o.start();
  g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + ms/1000);
  o.stop(ctx.currentTime + ms/1000);
}
function shake(){ if (navigator.vibrate) navigator.vibrate([45,35,45,35,55]); }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

function say(cls, big, small){
  document.body.className = cls;
  $("word").textContent = big;
  $("word").style.fontSize = big.length > 5 ? "13vw" : "24vw";
  $("sub").textContent = small || "";
}
function tally(){ $("score").textContent = plays ? wins + " on / " + plays + " thrown" : ""; }

function ready(){
  phase = "ready";
  clearTimers();
  say("", "throw", "");
  $("word").style.fontSize = "11vw";
  $("spot").style.display = "none";
}

/* ---------- the throw ---------- */
function onImpact(mag){
  var t = performance.now();
  if (phase !== "ready" || t - lastImpact < 1200) return;
  lastImpact = t;
  phase = "settle";
  plays++; tally();
  touching = false; lastPos = null;

  say("settle", "…", "landed at " + mag.toFixed(1) + " m/s2");
  beep(440, 70);
  BUZZES.forEach(function(ms){ later(shake, ms); });
  later(verdict, VERDICT_AT);
}

/* The screen quietly absorbs a motionless contact back into its baseline, so
   the last buzz before this runs is what makes a resting packet visible again. */
function verdict(){
  phase = "done";
  if (touching) {
    wins++;
    say("win", "WIN", lastPos
      ? "on the phone at " + lastPos.x + "% across, " + lastPos.y + "% down"
      : "on the phone");
    beep(660, 120); later(function(){ beep(990, 220); }, 130);
  } else {
    say("lose", "LOSE", "off the phone");
    beep(200, 160); later(function(){ beep(140, 320); }, 170);
  }
  tally();
  later(ready, HOLD_MS);
}

/* ---------- sensors ---------- */
function motion(ax, ay, az){
  var m = Math.hypot(ax, ay, az), t = performance.now();
  if (t < calEnd) { cal.push(m); return; }
  if (cal.length) {
    var mx = 0; for (var i=0;i<cal.length;i++) if (cal[i] > mx) mx = cal[i];
    accThr = Math.max(0.25, mx * 3.5); cal = [];
  }
  if (m > accThr) onImpact(m);
}
function startMotion(){
  if (window.LinearAccelerationSensor) {
    try {
      var a = new LinearAccelerationSensor({frequency:200});
      a.onreading = function(){ motion(a.x, a.y, a.z); };
      a.onerror = dm; a.start();
      calEnd = performance.now() + 1500; return;
    } catch(e){}
  }
  dm();
}
function dm(){
  function bind(){
    calEnd = performance.now() + 1500;
    addEventListener("devicemotion", function(e){
      var a = e.acceleration;
      if (!a || a.x === null) return;
      motion(a.x||0, a.y||0, a.z||0);
    });
  }
  if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission)
    DeviceMotionEvent.requestPermission().then(bind).catch(function(){});
  else bind();
}

/* ---------- touch ---------- */
function mark(t){
  touching = true;
  lastPos = { x: Math.round(t.clientX/innerWidth*100), y: Math.round(t.clientY/innerHeight*100) };
  var r = Math.max(t.radiusX||0, t.radiusY||0), d = Math.max(70, r*2);
  $("spot").style.cssText =
    "left:"+t.clientX+"px;top:"+t.clientY+"px;width:"+d+"px;height:"+d+"px;display:block";
}

document.addEventListener("touchstart", function(e){
  if (e.target.tagName === "BUTTON") return;
  e.preventDefault();
  if (!armed) {
    armed = true;
    try { ctx = new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); } catch(err){}
    startMotion(); ready();
    if (!navigator.vibrate) $("sub").textContent = "no vibrate api here, use the buzz button";
    return;
  }
  mark(e.changedTouches[0]);
  if (phase === "settle") $("sub").textContent = "on the phone, settling";
}, {passive:false});

document.addEventListener("touchmove", function(e){
  if (e.target.tagName === "BUTTON") return;
  e.preventDefault();
  mark(e.changedTouches[0]);
}, {passive:false});

function lift(e){
  if (e.target.tagName === "BUTTON") return;
  e.preventDefault();
  touching = false;
  if (phase === "settle") {
    $("sub").textContent = "slid off, checking again";
    $("spot").style.display = "none";
  }
}
document.addEventListener("touchend", lift, {passive:false});
document.addEventListener("touchcancel", lift, {passive:false});

/* ---------- buttons ---------- */
$("bBuzz").addEventListener("click", function(e){ e.stopPropagation(); shake(); beep(440,60); });
$("bReset").addEventListener("click", function(e){
  e.stopPropagation(); wins = 0; plays = 0; tally();
  if (armed) ready();
});
})();
</script>
</body>
</html>
