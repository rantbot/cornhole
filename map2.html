<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>where it works</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href='data:application/manifest+json,{"name":"Packet","short_name":"Packet","display":"fullscreen","orientation":"portrait","background_color":"%230d0d0d","theme_color":"%230d0d0d","start_url":"."}'>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0d0d0d; color: #888;
    font: 700 18px -apple-system, system-ui, sans-serif;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    transition: background .05s linear;
  }
  body.settle { background: #15306b; }
  body.win    { background: #0b4a26; }
  body.lose   { background: #5c1414; }
  #dots { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .dot { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px;
         border-radius: 50%; opacity: .85; }
  .dot.w { background: #00e676; }
  .dot.l { background: #ff5252; }
  #big { position: fixed; inset: 0; z-index: 2; pointer-events: none;
         display: flex; align-items: center; justify-content: center;
         font-size: 20vw; font-weight: 800; letter-spacing: -.04em;
         color: #fff; opacity: 0; transition: opacity .12s linear; }
  #big.on { opacity: .92; }
  #hud { position: fixed; top: calc(1.5vh + env(safe-area-inset-top)); left: 0; right: 0;
         text-align: center; z-index: 3; pointer-events: none;
         font-size: 15px; color: #aaa; }
  #why { position: fixed; bottom: calc(3vh + env(safe-area-inset-bottom)); left: 0; right: 0;
         text-align: center; z-index: 3; pointer-events: none; padding: 0 18px;
         font: 600 15px/1.35 -apple-system, system-ui, sans-serif; color: #ddd; }
  /* the only control, kept small and in a corner so it is not a landing zone */
  #oob { position: fixed; top: 0; left: 0; right: 0; height: 90px; z-index: 2;
         pointer-events: none; display: none;
         background: repeating-linear-gradient(45deg,#241010 0 10px,#1a0c0c 10px 20px);
         border-bottom: 2px solid #7a2222; }
  #oob.on { display: block; }
  #oob span { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center;
              font: 600 12px -apple-system, system-ui, sans-serif; color: #c96; }
  #install { position: fixed; bottom: calc(3vh + env(safe-area-inset-bottom)); left: 0; right: 0;
             text-align: center; z-index: 5; padding: 0 18px; color: #f0c674;
             font: 600 14px/1.4 -apple-system, system-ui, sans-serif; }
  #clear { position: fixed; top: calc(1vh + env(safe-area-inset-top)); left: 8px;
           width: 46px; height: 46px; border-radius: 50%; z-index: 4;
           background: #262626; color: #999; border: 1px solid #3a3a3a;
           font: 600 11px -apple-system, system-ui, sans-serif; }
</style>
</head>
<body>
  <div id="oob"><span>out of bounds, the address bar is here</span></div>
  <div id="dots"></div>
  <div id="big"></div>
  <div id="hud">tap anywhere to arm</div>
  <div id="why"></div>
  <div id="install"></div>
  <button id="clear">clear</button>

<script>
(function(){
"use strict";
var $ = function(i){ return document.getElementById(i); };

/* same scoring rule as v7, so the map measures what you have been playing */
var BUZZ_AT = [0, 200, 400, 620, 850, 1050];
var LATE_FROM = 550, VERDICT_AT = 1300;
var ARM_DELAY = 3000, BUZZ_DUR = 300, BUZZ_TAIL = 200, ACC_THR = 0.35;

var armed = false, ctx = null, waiting = false;
var wins = 0, plays = 0;
var lastImpact = -1e9, deafUntil = 0;
var down = 0, lastContact = 0, firstPos = null, lastPos = null;
var roundT0 = 0, timers = [];

function beep(f, ms){
  if (!ctx) return;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "square"; o.frequency.value = f; g.gain.value = .22;
  o.connect(g); g.connect(ctx.destination); o.start();
  g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + ms/1000);
  o.stop(ctx.currentTime + ms/1000);
}
function shake(){
  if (!navigator.vibrate) return;
  navigator.vibrate([45,35,45,35,45,35,60]);
  deafUntil = performance.now() + BUZZ_DUR + BUZZ_TAIL;
}
function rt(fn, ms){ timers.push(setTimeout(fn, ms)); }
function clearRound(){ timers.forEach(clearTimeout); timers = []; }

function zone(p){
  if (!p) return "nowhere";
  var h = p.x < 34 ? "left" : p.x < 67 ? "" : "right";
  var v = p.y < 34 ? "top" : p.y < 67 ? "" : "bottom";
  if (!h && !v) return "the middle";
  return "the " + (v && h ? v + " " + h : v || h);
}
function hud(){
  $("hud").textContent = plays ? wins + " on / " + plays + " thrown" : "throw";
}

function standalone(){
  return (window.matchMedia && window.matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches)
      || navigator.standalone === true
      || !!document.fullscreenElement;
}
function checkChrome(){
  var clean = standalone();
  $("oob").classList.toggle("on", !clean);
  if (clean) { $("install").textContent = ""; return; }
  $("install").textContent = navigator.standalone === false || /iPhone|iPad/.test(navigator.userAgent)
    ? "Share, then Add to Home Screen, and open it from there to use the whole screen."
    : "Menu, then Add to Home Screen, and open it from there to use the whole screen.";
}

function idle(){
  waiting = false; clearRound();
  document.body.className = "";
  $("big").classList.remove("on");
  hud();
}
function countdown(){
  waiting = false; clearRound();
  deafUntil = performance.now() + ARM_DELAY;
  var left = Math.ceil(ARM_DELAY / 1000);
  (function tick(){
    if (left <= 0) { $("big").classList.remove("on"); $("why").textContent = ""; idle(); return; }
    $("big").textContent = left; $("big").classList.add("on");
    $("why").textContent = "hands off the phone";
    left--; setTimeout(tick, 1000);
  })();
}

function plot(p, win){
  if (!p) return;
  var d = document.createElement("div");
  d.className = "dot " + (win ? "w" : "l");
  d.style.left = p.x + "%"; d.style.top = p.y + "%";
  $("dots").appendChild(d);
}

function onImpact(m){
  var t = performance.now();
  if (waiting || t < deafUntil || t - lastImpact < 900) return;
  clearRound();
  lastImpact = t; roundT0 = t; waiting = true;
  plays++; hud();
  lastContact = 0; firstPos = null; lastPos = null;
  document.body.className = "settle";
  $("big").textContent = "…"; $("big").classList.add("on");
  $("why").textContent = "";
  beep(440, 60);
  BUZZ_AT.forEach(function(ms){ rt(shake, ms); });
  rt(verdict, VERDICT_AT);
  rt(function(){ if (waiting) idle(); }, VERDICT_AT + 2500);
}

function verdict(){
  if (!waiting) return;
  waiting = false; clearRound();
  lastImpact = performance.now();

  var late = lastContact - roundT0;
  var on = down > 0 || (lastContact && late >= LATE_FROM);
  var slid = firstPos && lastPos &&
             Math.hypot(lastPos.x - firstPos.x, lastPos.y - firstPos.y) > 12;

  /* Plot at the point of first contact. Where it landed is what the map is
     about, not where it happened to end up. */
  plot(firstPos, on);

  if (on) {
    wins++;
    document.body.className = "win";
    $("big").textContent = "WIN";
    $("why").textContent = slid
      ? "Hit " + zone(firstPos) + ", settled in " + zone(lastPos) + "."
      : "Hit " + zone(firstPos) + " and stayed there.";
  } else {
    document.body.className = "lose";
    $("big").textContent = "LOSE";
    $("why").textContent = !lastContact
      ? "The screen never felt it at all."
      : slid ? "Hit " + zone(firstPos) + ", slid off the edge."
             : "Hit " + zone(firstPos) + ", then went quiet.";
  }
  $("big").classList.add("on");
  hud();
  beep(on ? 760 : 200, 100);
  rt(idle, 1500);
}

/* ---- sensors ---- */
function motion(ax, ay, az){
  var m = Math.sqrt(ax*ax + ay*ay + az*az);
  if (m > ACC_THR) onImpact(m);
}
function startMotion(){
  if (window.LinearAccelerationSensor) {
    try {
      var a = new LinearAccelerationSensor({frequency:200});
      a.onreading = function(){ motion(a.x, a.y, a.z); };
      a.onerror = dm; a.start(); return;
    } catch(e){}
  }
  dm();
}
function dm(){
  function bind(){
    addEventListener("devicemotion", function(e){
      var a = e.acceleration;
      if (!a || a.x === null) return;
      motion(a.x||0, a.y||0, a.z||0);
    });
  }
  if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission)
    DeviceMotionEvent.requestPermission().then(bind).catch(function(){});
  else bind();
}

/* ---- touch, over the whole screen with nothing in the way ---- */
function contact(t){
  lastContact = performance.now();
  lastPos = { x: +(t.clientX/innerWidth*100).toFixed(1),
              y: +(t.clientY/innerHeight*100).toFixed(1) };
  if (!firstPos) firstPos = lastPos;
}
document.addEventListener("touchstart", function(e){
  if (e.target.id === "clear") return;
  e.preventDefault();
  if (!armed) {
    armed = true;
    try { ctx = new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); } catch(err){}
    startMotion();
    var el = document.documentElement;
    var fs = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fs) { try { fs.call(el).then(checkChrome, checkChrome); } catch(err){} }
    setTimeout(checkChrome, 400);
    countdown();
    if (!navigator.vibrate) $("why").textContent = "no vibrate api on this browser";
    return;
  }
  down = e.touches.length;
  contact(e.changedTouches[0]);
}, {passive:false});
document.addEventListener("touchmove", function(e){
  if (e.target.id === "clear") return;
  e.preventDefault();
  if (waiting) contact(e.changedTouches[0]);
}, {passive:false});
function lift(e){
  if (e.target.id === "clear") return;
  e.preventDefault();
  down = e.touches.length;
}
document.addEventListener("touchend", lift, {passive:false});
document.addEventListener("touchcancel", lift, {passive:false});

addEventListener("resize", checkChrome);
checkChrome();

$("clear").addEventListener("click", function(e){
  e.stopPropagation();
  $("dots").innerHTML = ""; wins = 0; plays = 0; hud();
});
})();
</script>
</body>
</html>
