<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>impact</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0a0a0a; color: #666;
    font: 700 20px/1.2 -apple-system, system-ui, sans-serif;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    display: flex; align-items: center; justify-content: center;
    transition: background .04s linear;
  }
  body.win  { background: #00c853; color: #000; }
  body.lose { background: #c62828; color: #fff; }
  #word { font-size: 26vw; font-weight: 800; letter-spacing: -.04em; text-align: center; z-index: 2; }
  #sub  { position: fixed; bottom: 16vh; left: 0; right: 0; text-align: center;
          font-size: 4.2vw; z-index: 2; opacity: .85; }
  #score{ position: fixed; top: calc(2vh + env(safe-area-inset-top)); left: 0; right: 0;
          text-align: center; font-size: 4.2vw; opacity: .6; z-index: 2; }
  #diag { position: fixed; bottom: calc(58px + env(safe-area-inset-bottom)); left: 0; right: 0;
          text-align: center; z-index: 2; opacity: .45; color: #ccc;
          font: 400 11px ui-monospace, Menlo, monospace; }
  #spot { position: fixed; border: 6px solid #fff; border-radius: 50%;
          transform: translate(-50%,-50%); display: none; z-index: 1; }
  #ring { position: fixed; inset: 0; border: 5px solid transparent; z-index: 4;
          pointer-events: none; transition: border-color .1s linear; }
  #ring.live { border-color: #3a3a3a; }
  #bar  { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; display: flex; gap: 1px; background: #333; }
  #bar button { flex: 1; padding: 13px 0 calc(13px + env(safe-area-inset-bottom));
                background: #1a1a1a; color: #888; border: 0;
                font: 600 15px -apple-system, system-ui, sans-serif; }
  #bar button.off { color: #4a4a4a; }
</style>
</head>
<body>
  <div id="spot"></div>
  <div id="word">tap to arm</div>
  <div id="sub"></div>
  <div id="score"></div>
  <div id="diag"></div>
  <div id="ring"></div>
  <div id="bar">
    <button id="bAxis">axis filter on</button>
    <button id="bSens">less sensitive</button>
    <button id="bReset">reset</button>
  </div>

<script>
(function(){
"use strict";
var $ = function(i){ return document.getElementById(i); };

var BUZZ_AT  = [20, 200];
var LOCK_AT  = 520;    // verdict is final here
var REARM_AT = 500;    // lockout after a verdict, covers the pickup

var armed = false, ctx = null;
var wins = 0, plays = 0;
var phase = "cold";                  // cold | ready | settle | done
var impactAt = -1e9, timers = [], called = null, lastPos = null;
var accThr = 0.7, base = 0.2, sens = 3.5, cal = [], calEnd = 0;
var axisFilter = true;

function beep(f, ms, type){
  if (!ctx) return;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || "square"; o.frequency.value = f; g.gain.value = .25;
  o.connect(g); g.connect(ctx.destination); o.start();
  g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + ms/1000);
  o.stop(ctx.currentTime + ms/1000);
}
function shake(){ if (navigator.vibrate) navigator.vibrate([40,30,50]); }
function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
function diag(s){ $("diag").textContent = s; }

function say(cls, big, small){
  document.body.className = cls;
  $("word").textContent = big;
  $("word").style.fontSize = big.length > 5 ? "13vw" : "26vw";
  $("sub").textContent = small || "";
}
function tally(){ $("score").textContent = plays ? wins + " on / " + plays : ""; }

function ready(){
  phase = "ready"; clearTimers(); called = null;
  say("", "throw", "");
  $("word").style.fontSize = "11vw";
  $("spot").style.display = "none";
  $("ring").classList.add("live");
  beep(1400, 35, "sine");
}

function callWin(){
  if (called) return;
  called = "win"; wins++; plays++; tally();
  say("win", "WIN", lastPos ? lastPos.x + "% across, " + lastPos.y + "% down" : "");
  beep(760, 90); later(function(){ beep(1140, 150); }, 95);
}
function callLose(){
  if (called) return;
  called = "lose"; plays++; tally();
  say("lose", "LOSE", "off the phone");
  $("spot").style.display = "none";
  beep(200, 130); later(function(){ beep(140, 220); }, 140);
}

function onImpact(m, ax, ay, az){
  if (phase !== "ready") return;

  /* A packet lands straight down through the glass, so z carries most of it.
     A knock to the table or the side of the phone is mostly lateral. */
  var zshare = Math.abs(az) / m;
  if (axisFilter && zshare < 0.55) {
    diag("bump ignored  |a|=" + m.toFixed(2) + "  z share " + zshare.toFixed(2));
    return;
  }

  phase = "settle"; impactAt = performance.now();
  called = null; lastPos = null;
  clearTimers();
  $("ring").classList.remove("live");
  say("", "…", "");
  $("word").style.fontSize = "18vw";
  diag("impact |a|=" + m.toFixed(2) + "  z share " + zshare.toFixed(2) + "  thr " + accThr.toFixed(2));

  BUZZ_AT.forEach(function(ms){ later(shake, ms); });
  later(function(){
    if (!called) callLose();
    phase = "done";
    later(ready, REARM_AT);
  }, LOCK_AT);
}

/* ---------- sensors ---------- */
function motion(ax, ay, az){
  var m = Math.hypot(ax, ay, az), t = performance.now();
  if (t < calEnd) { cal.push(m); return; }
  if (cal.length) {
    var mx = 0; for (var i=0;i<cal.length;i++) if (cal[i] > mx) mx = cal[i];
    base = mx; accThr = Math.max(0.2, base * sens); cal = [];
    diag("floor " + base.toFixed(3) + "  trigger " + accThr.toFixed(2) + " m/s2");
  }
  if (m > accThr) onImpact(m, ax, ay, az);
}
function startMotion(){
  if (window.LinearAccelerationSensor) {
    try {
      var a = new LinearAccelerationSensor({frequency:200});
      a.onreading = function(){ motion(a.x, a.y, a.z); };
      a.onerror = dm; a.start();
      calEnd = performance.now() + 1500; return;
    } catch(e){}
  }
  dm();
}
function dm(){
  function bind(){
    calEnd = performance.now() + 1500;
    addEventListener("devicemotion", function(e){
      var a = e.acceleration;
      if (!a || a.x === null) { diag("no linear accel on this device"); return; }
      motion(a.x||0, a.y||0, a.z||0);
    });
  }
  if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission)
    DeviceMotionEvent.requestPermission().then(bind).catch(function(){ diag("motion denied"); });
  else bind();
}

/* ---------- touch ---------- */
function inWindow(){ return phase === "settle" && performance.now() - impactAt < LOCK_AT + 60; }
function mark(t){
  lastPos = { x: Math.round(t.clientX/innerWidth*100), y: Math.round(t.clientY/innerHeight*100) };
  var r = Math.max(t.radiusX||0, t.radiusY||0), d = Math.max(70, r*2);
  $("spot").style.cssText =
    "left:"+t.clientX+"px;top:"+t.clientY+"px;width:"+d+"px;height:"+d+"px;display:block";
}

document.addEventListener("touchstart", function(e){
  if (e.target.tagName === "BUTTON") return;
  e.preventDefault();
  if (!armed) {
    armed = true;
    try { ctx = new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); } catch(err){}
    startMotion(); ready();
    if (!navigator.vibrate) diag("no vibrate api on this browser");
    return;
  }
  if (inWindow()) { mark(e.changedTouches[0]); callWin(); }
  else diag("touch with no impact behind it");
}, {passive:false});

document.addEventListener("touchmove", function(e){
  if (e.target.tagName === "BUTTON") return;
  e.preventDefault();
  if (inWindow()) mark(e.changedTouches[0]);
}, {passive:false});

function lift(e){
  if (e.target.tagName === "BUTTON") return;
  e.preventDefault();
  if (inWindow() && !called) callLose();   // landed then slid straight off
}
document.addEventListener("touchend", lift, {passive:false});
document.addEventListener("touchcancel", lift, {passive:false});

/* ---------- buttons ---------- */
$("bAxis").addEventListener("click", function(e){
  e.stopPropagation();
  axisFilter = !axisFilter;
  this.textContent = axisFilter ? "axis filter on" : "axis filter off";
  this.className = axisFilter ? "" : "off";
});
$("bSens").addEventListener("click", function(e){
  e.stopPropagation();
  sens = sens >= 8 ? 2 : sens + 2;
  accThr = Math.max(0.2, base * sens);
  this.textContent = "trigger " + accThr.toFixed(2);
  diag("trigger now " + accThr.toFixed(2) + " m/s2  (floor " + base.toFixed(3) + ")");
});
$("bReset").addEventListener("click", function(e){
  e.stopPropagation(); wins = 0; plays = 0; tally(); if (armed) ready();
});
})();
</script>
</body>
</html>
