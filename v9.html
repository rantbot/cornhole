<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>stayed or bounced</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0a0a0a; color: #777;
    font: 700 20px/1.2 -apple-system, system-ui, sans-serif;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    display: flex; align-items: center; justify-content: center;
    transition: background .05s linear;
  }
  body.settle { background: #2962ff; color: #fff; }
  body.win    { background: #00c853; color: #000; }
  body.lose   { background: #c62828; color: #fff; }
  #word { font-size: 22vw; font-weight: 800; letter-spacing: -.04em; text-align: center; z-index: 2; }
  #sub  { position: fixed; bottom: 14vh; left: 0; right: 0; text-align: center; font-size: 4.5vw; z-index: 2; }
  #score{ position: fixed; top: calc(2vh + env(safe-area-inset-top)); left: 0; right: 0;
          text-align: center; font-size: 4vw; opacity: .55; z-index: 2; }
  #trace{ position: fixed; bottom: calc(64px + env(safe-area-inset-bottom)); left: 0; right: 0;
          text-align: center; z-index: 3; color: #fff; opacity: .85; padding: 0 16px;
          font: 600 4.4vw/1.35 -apple-system, system-ui, sans-serif; }
  #spot { position: fixed; border: 6px solid #fff; border-radius: 50%;
          transform: translate(-50%,-50%); display: none; z-index: 1; }
  #bar  { position: fixed; bottom: 0; left: 0; right: 0; z-index: 4;
          display: flex; gap: 1px; background: #333; border-top: 1px solid #333; }
  #bar button { flex: 1; padding: 15px 0 calc(15px + env(safe-area-inset-bottom));
                background: #1c1c1c; color: #ddd; border: 0;
                font: 700 15px -apple-system, system-ui, sans-serif; }
</style>
</head>
<body>
  <div id="spot"></div>
  <div id="word">tap to arm</div>
  <div id="sub"></div>
  <div id="score"></div>
  <div id="trace"></div>
  <div id="bar">
    <button id="bThr">trigger</button>
    <button id="bLate">cutoff</button>
    <button id="bReset">reset</button>
  </div>

<script>
(function(){
"use strict";
var $ = function(i){ return document.getElementById(i); };

/* ---- the round ----
   Buzz steadily right through the window, while the packet is still loose
   enough to move. A packet that stayed keeps getting picked up again. One
   that bounced goes quiet within a couple of hundred milliseconds and never
   comes back. So the question is not "is it there at the end" but "was it
   still being seen late". */
var BUZZ_AT   = [0, 200, 400, 620, 850, 1050];
var LATE_FROM = 550;    // contact after this counts as still on the phone
var VERDICT_AT= 1300;
var ARM_DELAY = 3000;   // your finger leaving the glass out-jolts any packet
var BUZZ_DUR  = 300, BUZZ_TAIL = 200;

var armed = false, ctx = null, waiting = false;
var wins = 0, plays = 0;
var lastImpact = -1e9, deafUntil = 0;
var down = 0, lastContact = 0, lastPos = null, firstPos = null;
var trace = [], roundT0 = 0, timers = [];
var accThr = 0.35, recentPeak = 0;
var extended = false, poll = null;
var EXTRA_BUZZ = [0, 350, 700];   // only used when nothing was ever seen
var EXTRA_FOR  = 1100;

function beep(f, ms){
  if (!ctx) return;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "square"; o.frequency.value = f; g.gain.value = .25;
  o.connect(g); g.connect(ctx.destination); o.start();
  g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + ms/1000);
  o.stop(ctx.currentTime + ms/1000);
}
function shake(){
  if (!navigator.vibrate) return;
  navigator.vibrate([45,35,45,35,45,35,60]);
  deafUntil = performance.now() + BUZZ_DUR + BUZZ_TAIL;   // it hears its own motor
}
function shakeHard(){
  if (!navigator.vibrate) return;
  navigator.vibrate(500);
  deafUntil = performance.now() + 500 + BUZZ_TAIL;
}
function rt(fn, ms){ timers.push(setTimeout(fn, ms)); }
function clearRound(){ timers.forEach(clearTimeout); timers = []; }

function say(cls, big, small){
  document.body.className = cls;
  $("word").textContent = big;
  $("word").style.fontSize = big.length > 6 ? "11vw" : "22vw";
  $("sub").textContent = small || "";
}
function tally(){ $("score").textContent = plays ? wins + " on / " + plays + " thrown" : ""; }

function idle(){
  waiting = false; clearRound(); recentPeak = 0;
  say("", "throw", "");
  $("word").style.fontSize = "10vw";
  $("spot").style.display = "none";
}
function countdown(){
  waiting = false; clearRound();
  deafUntil = performance.now() + ARM_DELAY;
  document.body.className = "";
  $("word").style.fontSize = "22vw";
  var left = Math.ceil(ARM_DELAY / 1000);
  (function tick(){
    if (left <= 0) { idle(); return; }
    $("word").textContent = left;
    $("sub").textContent = "hands off the phone";
    left--; setTimeout(tick, 1000);
  })();
}

/* ---- impact ---- */
function onImpact(m){
  var t = performance.now();
  if (waiting) return;                    // never restart a round in flight
  if (t < deafUntil) return;
  if (t - lastImpact < 900) return;

  clearRound();
  lastImpact = t; roundT0 = t;
  waiting = true; plays++; tally();
  trace = []; lastContact = 0; lastPos = null; firstPos = null;
  extended = false; clearInterval(poll);
  /* the moment it is clearly on the phone, stop and say so */
  poll = setInterval(function(){
    if (!waiting) { clearInterval(poll); return; }
    if (down > 0 || (lastContact && lastContact - roundT0 >= LATE_FROM)) {
      clearInterval(poll); verdict();
    }
  }, 40);

  say("settle", "…", "landed at " + m.toFixed(2));
  $("trace").textContent = "";
  beep(440, 70);
  BUZZ_AT.forEach(function(ms){ rt(shake, ms); });
  rt(verdict, VERDICT_AT);
  rt(function(){ if (waiting) idle(); }, VERDICT_AT + 2500);   // watchdog
}

function verdict(){
  if (!waiting) return;

  /* Nothing has been felt at all. That is the one case worth more buzzing,
     so give it a longer, harder shake before calling it. A packet that
     touched and went quiet is a real bounce and gets called now. */
  if (!lastContact && !extended) {
    extended = true;
    clearRound();
    $("sub").textContent = "still looking";
    EXTRA_BUZZ.forEach(function(ms){ rt(shakeHard, ms); });
    rt(verdict, EXTRA_FOR);
    rt(function(){ if (waiting) idle(); }, EXTRA_FOR + 2500);
    return;
  }

  waiting = false; clearRound(); clearInterval(poll);
  lastImpact = performance.now();

  var late = lastContact - roundT0;
  var stillOn = down > 0 || (lastContact && late >= LATE_FROM);

  var slid = moved() > 12;

  if (stillOn) {
    wins++;
    $("trace").textContent = slid
      ? "Hit " + zone(firstPos) + ", settled in " + zone(lastPos) + "."
      : "Hit " + zone(firstPos) + " and stayed there.";
    say("win", "WIN", "");
    beep(760, 90); setTimeout(function(){ beep(1140, 160); }, 95);
  } else {
    var why;
    if (!lastContact) why = "The screen never felt it, even after extra buzzing.";
    else if (slid)    why = "Hit " + zone(firstPos) + ", slid to " + zone(lastPos) + ", then off the edge.";
    else              why = "Hit " + zone(firstPos) + ", then came straight back off.";
    $("trace").textContent = why;
    say("lose", "LOSE", "");
    $("spot").style.display = "none";
    beep(200, 130); setTimeout(function(){ beep(140, 240); }, 140);
  }
  tally();
  rt(idle, 1800);
}

/* ---- sensors ---- */
function motion(ax, ay, az){
  var m = Math.sqrt(ax*ax + ay*ay + az*az);
  if (m > recentPeak) recentPeak = m;
  if (m > accThr) onImpact(m);
}
function startMotion(){
  if (window.LinearAccelerationSensor) {
    try {
      var a = new LinearAccelerationSensor({frequency:200});
      a.onreading = function(){ motion(a.x, a.y, a.z); };
      a.onerror = dm; a.start(); return;
    } catch(e){}
  }
  dm();
}
function dm(){
  function bind(){
    addEventListener("devicemotion", function(e){
      var a = e.acceleration;
      if (!a || a.x === null) return;
      motion(a.x||0, a.y||0, a.z||0);
    });
  }
  if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission)
    DeviceMotionEvent.requestPermission().then(bind).catch(function(){});
  else bind();
}

/* ---- touch ---- */
/* plain words instead of percentages */
function zone(p){
  if (!p) return "nowhere";
  var h = p.x < 34 ? "left" : p.x < 67 ? "" : "right";
  var v = p.y < 34 ? "top" : p.y < 67 ? "" : "bottom";
  if (!h && !v) return "the middle";
  return "the " + (v && h ? v + " " + h : v || h);
}
function moved(){
  if (!firstPos || !lastPos) return 0;
  return Math.hypot(lastPos.x - firstPos.x, lastPos.y - firstPos.y);
}

function contact(t){
  lastContact = performance.now();
  if (waiting) trace.push("d" + Math.round(lastContact - roundT0));
  lastPos = { x: Math.round(t.clientX/innerWidth*100), y: Math.round(t.clientY/innerHeight*100) };
  if (!firstPos) firstPos = lastPos;
  var r = Math.max(t.radiusX||0, t.radiusY||0), d = Math.max(70, r*2);
  $("spot").style.cssText =
    "left:"+t.clientX+"px;top:"+t.clientY+"px;width:"+d+"px;height:"+d+"px;display:block";
}

document.addEventListener("touchstart", function(e){
  if (e.target.tagName === "BUTTON") return;
  e.preventDefault();
  if (!armed) {
    armed = true;
    try { ctx = new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); } catch(err){}
    startMotion(); countdown();
    if (!navigator.vibrate) $("sub").textContent = "no vibrate api on this browser";
    tally();
    return;
  }
  down = e.touches.length;
  contact(e.changedTouches[0]);
}, {passive:false});

document.addEventListener("touchmove", function(e){
  if (e.target.tagName === "BUTTON") return;
  e.preventDefault();
  if (waiting) contact(e.changedTouches[0]);
}, {passive:false});

function lift(e){
  if (e.target.tagName === "BUTTON") return;
  e.preventDefault();
  if (waiting) trace.push("u" + Math.round(performance.now() - roundT0));
  down = e.touches.length;
}
document.addEventListener("touchend", lift, {passive:false});
document.addEventListener("touchcancel", lift, {passive:false});

/* ---- buttons ---- */
var THR = [0.10, 0.15, 0.25, 0.35, 0.50, 0.80];
var LATE = [300, 400, 550, 700, 900];
$("bThr").addEventListener("click", function(e){
  e.stopPropagation();
  accThr = THR[(THR.indexOf(accThr) + 1) % THR.length];
  this.textContent = "trig " + accThr.toFixed(2);
});
$("bLate").addEventListener("click", function(e){
  e.stopPropagation();
  LATE_FROM = LATE[(LATE.indexOf(LATE_FROM) + 1) % LATE.length];
  this.textContent = "cut " + LATE_FROM;
});
$("bReset").addEventListener("click", function(e){
  e.stopPropagation(); wins = 0; plays = 0; tally(); if (armed) idle();
});
$("bThr").textContent = "trig " + accThr.toFixed(2);
$("bLate").textContent = "cut " + LATE_FROM;

setInterval(function(){
  if (waiting || !armed || document.body.className !== "") return;
  $("sub").textContent = "heard " + recentPeak.toFixed(2) + "   trigger " + accThr.toFixed(2);
  recentPeak *= 0.97;
}, 200);
})();
</script>
</body>
</html>
