<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>packet cornhole</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Packet">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="./manifest.webmanifest">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0d0d0d; color: #888;
    font: 700 18px -apple-system, system-ui, sans-serif;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    transition: background .05s linear;
  }
  body.settle { background: #15306b; }
  body.win    { background: #0b4a26; }
  body.lose   { background: #5c1414; }

  /* everything above the play surface must not swallow a touch */
  #dots, #big, #hud, #why { pointer-events: none; }

  /* the board, inset from the edges where detection is least reliable */
  #board { position: fixed; left: 3%; right: 3%; top: 5%; bottom: 5%; z-index: 0;
           border: 2px solid #2f3a45; border-radius: 16px; pointer-events: none;
           background: #121820; }
  #hole  { position: fixed; left: 50%; top: 33%; width: 42%; z-index: 0;
           aspect-ratio: 1; transform: translate(-50%,-50%); border-radius: 50%;
           background: #05070a; border: 2px solid #3d4c5a; pointer-events: none; }
  #hole::after { content: "3"; position: absolute; inset: 0; display: flex;
                 align-items: center; justify-content: center;
                 font: 800 46px -apple-system, system-ui, sans-serif; color: #2b3742; }
  #dots { position: fixed; inset: 0; z-index: 1; }
  body.three { background: #8a6a00; }
  #burst { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
  .bit { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px;
         border-radius: 3px; opacity: 0;
         animation: fly 900ms cubic-bezier(.15,.7,.3,1) forwards; }
  @keyframes fly {
    0%   { opacity: 1; transform: translate(0,0) scale(.5) rotate(0deg); }
    70%  { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(var(--rot)); }
  }
  #hole.pop { animation: pop 520ms cubic-bezier(.2,1.5,.4,1); }
  @keyframes pop {
    0%   { transform: translate(-50%,-50%) scale(1); }
    40%  { transform: translate(-50%,-50%) scale(1.16); }
    100% { transform: translate(-50%,-50%) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bit, #hole.pop { animation: none; }
  }
  .dot { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px;
         border-radius: 50%; opacity: .8; }
  .dot.w { background: #00e676; }
  .dot.h { background: #ffd54f; }
  /* scored, but the screen never told us exactly where. shown mid board. */
  .dot.u { background: rgba(0,230,118,.18); border: 2px dashed #00e676; }
  #live { position: fixed; width: 44px; height: 44px; margin: -22px 0 0 -22px;
          border: 3px solid #fff; border-radius: 50%; z-index: 2;
          pointer-events: none; display: none; }
    .dot.last { box-shadow: 0 0 0 3px #fff; opacity: 1; }

  #big { position: fixed; inset: 0; z-index: 2; display: flex;
         align-items: center; justify-content: center;
         font-size: 21vw; font-weight: 800; letter-spacing: -.04em;
         color: #fff; opacity: 0; transition: opacity .1s linear; }
  #big.on { opacity: .93; }
  #hud { position: fixed; top: calc(1.2vh + env(safe-area-inset-top)); left: 0; right: 0;
         text-align: center; z-index: 3; color: #8d97a3; line-height: 1.05; }
  #scores { display: flex; gap: 10px; justify-content: center; }
  .pl { flex: 0 0 40%; padding: 5px 8px 6px; border-radius: 10px;
        border: 1px solid #262e36; background: rgba(20,24,29,.6); }
  .pl b { display: block; font: 700 10px -apple-system, system-ui, sans-serif;
          color: #6a7480; letter-spacing: .02em; }
  .pl span { display: block; font-size: 26px; font-weight: 800; letter-spacing: -.03em;
             color: #7f8a96; font-variant-numeric: tabular-nums;
             transition: transform .18s cubic-bezier(.2,1.6,.4,1), color .18s ease; }
  .pl.on { border-color: #2f6b4a; background: rgba(0,200,83,.10); }
  .pl.on b { color: #6ee7a8; }
  .pl.on span { color: #eef4f8; }
  .pl.bump span { transform: scale(1.25); color: #ffd54f; }
  #ptsSub { display: block; font-size: 12px; font-weight: 600; margin-top: 3px; }
  #bags { display: flex; gap: 6px; justify-content: center; margin-top: 7px; }
  #bags i { width: 11px; height: 11px; border-radius: 3px; background: #e8edf2;
            transition: background .2s ease, opacity .2s ease; }
  #bags i.used { background: transparent; box-shadow: inset 0 0 0 2px #46525f; opacity: .8; }
  #why { position: fixed; bottom: calc(3.5vh + env(safe-area-inset-bottom)); left: 0; right: 0;
         text-align: center; z-index: 3; padding: 0 20px; color: #e8e8e8;
         font: 600 16px/1.35 -apple-system, system-ui, sans-serif; }

  /* two small corner controls, well clear of where a packet lands */
  #clear { position: fixed; top: calc(0.8vh + env(safe-area-inset-top)); left: 8px;
           width: 44px; height: 44px; border-radius: 50%; z-index: 4;
           background: rgba(30,34,40,.9); color: #7d8894; border: 1px solid #333c46;
           font: 600 11px -apple-system, system-ui, sans-serif; }
  /* a hairline where the browser bar sits, nothing more */
  #oob { position: fixed; top: 0; left: 0; right: 0; height: 1px; z-index: 0;
         pointer-events: none; display: none; background: #33404d; }
  #oob.on { display: block; }
  #install { position: fixed; bottom: calc(6px + env(safe-area-inset-bottom));
             left: 50%; transform: translateX(-50%); z-index: 3; display: none;
             max-width: 88%; align-items: center; gap: 8px;
             padding: 7px 8px 7px 12px; border-radius: 999px;
             background: rgba(28,32,38,.82); border: 1px solid #2b333d;
             color: #8d97a3; font: 500 11.5px/1.3 -apple-system, system-ui, sans-serif; }
  #install.on { display: flex; }
  #install b { font-weight: 600; color: #aab4c0; }
  #dismiss { width: 22px; height: 22px; flex: none; border-radius: 50%;
             background: #2b333d; color: #8d97a3; border: 0; font-size: 13px; line-height: 1; }
  /* readable on the dark board and on the green, amber and red verdict flashes */
  /* pointer-events stays off so the tap reaches the same handler that arms it */
  #start { position: fixed; inset: 0; z-index: 6; pointer-events: none;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 22px; padding: 0 30px; text-align: center;
           background: radial-gradient(120% 80% at 50% 38%, #16202b 0%, #0b0e12 70%); }
  #start.gone { display: none; }
  #start h1 { margin: 0; font-size: 40px; line-height: 1.02; font-weight: 800;
              letter-spacing: -.035em; color: #f2f6fa; }
  #start p  { margin: 0; max-width: 22ch; color: #8b96a3;
              font: 500 15px/1.5 -apple-system, system-ui, sans-serif; }
  #start .tap { margin-top: 10px; padding: 15px 30px; border-radius: 999px;
                border: 2px solid #2f9e6b; color: #6ee7a8; background: rgba(0,200,83,.09);
                font: 700 18px -apple-system, system-ui, sans-serif;
                animation: breathe 2.4s ease-in-out infinite; }
  #start small { color: #5d6875; font: 500 12px -apple-system, system-ui, sans-serif; }
  @keyframes breathe {
    0%,100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(0,200,83,.30); }
    50%     { transform: scale(1.04); box-shadow: 0 0 0 16px rgba(0,200,83,0); }
  }
  @media (prefers-reduced-motion: reduce) { #start .tap { animation: none; } }
  #build { position: fixed; right: 7px; bottom: calc(6px + env(safe-area-inset-bottom));
           z-index: 5; pointer-events: none; padding: 3px 7px; border-radius: 6px;
           background: rgba(0,0,0,.42); color: #b9c4cf;
           font: 600 11px ui-monospace, Menlo, monospace; letter-spacing: .02em; }
</style>
</head>
<body>
  <div id="oob"></div>
  <div id="board"></div>
  <div id="hole"></div>
  <div id="dots"></div>
  <div id="live"></div>
  <div id="burst"></div>
  <div id="start">
    <h1 id="startTitle">Packet<br>Cornhole</h1>
    <p id="startBody">Lay the phone flat, screen up. Throw a foil-wrapped sugar packet at it.</p>
    <div class="tap" id="startTap">Tap anywhere to start</div>
    <small id="startFoot">Then hands off the phone for a moment.</small>
  </div>
  <div id="build">b37</div>
  <div id="big"></div>
    <div id="hud">
    <div id="scores">
      <div class="pl" id="p0"><b>Player 1</b><span>0</span></div>
      <div class="pl" id="p1"><b>Player 2</b><span>0</span></div>
    </div>
    <span id="bags"></span><span id="ptsSub"></span>
  </div>
  <div id="why"></div>
  <div id="install"><span id="installText"></span><button id="dismiss">&times;</button></div>
  <button id="clear">clear</button>

<script>
(function(){
"use strict";
var $ = function(i){ return document.getElementById(i); };

/* The buzz drowns out everything, so it waits. A bounced packet needs time to
   travel and land, and the phone has to be quiet to hear it arrive. */
var LISTEN_MS  = 850;   // quiet window, listening for it landing somewhere else
var BLANK_MS   = 200;   // the landing itself rings for longer than you would think
var BUZZ_AT    = [850, 1050, 1250, 1470, 1700];
var VERDICT_AT = 2000;
var LATE_FROM  = 950;   // was the med step of the bounce dial
var EXTRA_BUZZ = [0, 350, 700], EXTRA_FOR = 1100;
var ARM_QUIET  = 2000;          // silent, no countdown on screen
var BUZZ_DUR   = 300, BUZZ_TAIL = 200;
var ACC_THR    = 0.30;  // was the med step of the trigger dial

var armed = false, ctx = null, waiting = false, extended = false;
var wins = 0, plays = 0;
var lastImpact = -1e9, deafUntil = 0;
var down = 0, lastContact = 0, firstPos = null, lastPos = null;
var roundT0 = 0, timers = [], poll = null, lastDot = null, impactMag = 0;
var secondHit = 0;      // it came off and hit something else
var settled = false;    // the phone went quiet after the landing
var firstContactAt = 0, liftAt = 0;
var BRIEF_MS = 300;     // a bounce brushes the glass, it does not rest on it
var points = 0, firstPx = null, lastPx = null;
var BAGS = 4, bagsLeft = BAGS, frame = 1, frameStart = 0;
var scores = [0, 0], turn = 0, paused = false;
var impactZ = 1;          // how much of the hit went straight down through the glass
var Z_HARD = 0.34;        // clearly sideways. never even opens a round.
var Z_MIN  = 0.55;        // borderline. opens one, but dropped if nothing lands.
var appealUntil = 0;      // a lost round can still be put right if it turns up
var touchOrigin = null, touchMoved = 0;   // telling a pickup from a quiet drop
var lastTouchStart = -1e9;                // when something newly arrived on the glass
var HAND_WINDOW = 1400;                   // a contact this fresh, still down, is a hand
var pendingDot = null, pendingUntil = 0;  // a bag placed before we knew its spot
var PENDING_MS = 8000;
var PICKUP_PX  = 14;      // a lifted packet drags this far, a dropped one does not
var PICKUP_TAIL = 900;    // stay deaf that long after a hand has been on the glass
var APPEAL_MS = 5000;

function beep(f, ms){
  if (!ctx) return;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "square"; o.frequency.value = f; g.gain.value = .22;
  o.connect(g); g.connect(ctx.destination); o.start();
  g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + ms/1000);
  o.stop(ctx.currentTime + ms/1000);
}
function celebrate(){
  var W = innerWidth, H = innerHeight;
  var cx = W * 0.5, cy = H * 0.33;
  var cols = ["#ffd54f", "#ffffff", "#00e676", "#ffab40"];
  var frag = document.createDocumentFragment();
  for (var i = 0; i < 22; i++) {
    var a = (Math.PI * 2 * i) / 22 + Math.random() * 0.3;
    var dist = 90 + Math.random() * 150;
    var b = document.createElement("div");
    b.className = "bit";
    b.style.left = cx + "px"; b.style.top = cy + "px";
    b.style.background = cols[i % cols.length];
    b.style.setProperty("--dx", Math.cos(a) * dist + "px");
    b.style.setProperty("--dy", Math.sin(a) * dist + "px");
    b.style.setProperty("--rot", Math.round(Math.random() * 540 - 270) + "deg");
    b.style.animationDelay = Math.round(Math.random() * 90) + "ms";
    frag.appendChild(b);
  }
  $("burst").appendChild(frag);
  setTimeout(function(){ $("burst").innerHTML = ""; }, 1200);

  $("hole").classList.add("pop");
  setTimeout(function(){ $("hole").classList.remove("pop"); }, 560);

  [[660,0],[880,110],[1320,220],[1760,340]].forEach(function(n){
    setTimeout(function(){ beep(n[0], 200); }, n[1]);
  });
  if (navigator.vibrate) {
    navigator.vibrate([70,50,70,50,150]);
    deafUntil = performance.now() + 700;   // do not hear our own party
  }
}

function shake(){
  if (!navigator.vibrate) return;
  navigator.vibrate([45,35,45,35,45,35,60]);
  deafUntil = performance.now() + BUZZ_DUR + BUZZ_TAIL;
}
function shakeHard(){
  if (!navigator.vibrate) return;
  navigator.vibrate(500);
  deafUntil = performance.now() + 500 + BUZZ_TAIL;
}
function rt(fn, ms){ timers.push(setTimeout(fn, ms)); }
function clearRound(){ timers.forEach(clearTimeout); timers = []; clearInterval(poll); poll = null; }

/* which part of the board it came down on */
function target(px){
  if (!px) return "unknown";
  var W = innerWidth, H = innerHeight;
  var hx = W * 0.5, hy = H * 0.33, hr = W * 0.21;
  if (Math.hypot(px.x - hx, px.y - hy) <= hr) return "hole";
  var inBoard = px.x > W*0.03 && px.x < W*0.97 && px.y > H*0.05 && px.y < H*0.95;
  return inBoard ? "board" : "outside";
}

function zone(p){
  if (!p) return "nowhere";
  var h = p.x < 34 ? "left" : p.x < 67 ? "" : "right";
  var v = p.y < 34 ? "top" : p.y < 67 ? "" : "bottom";
  if (!h && !v) return "the middle";
  return "the " + (v && h ? v + " " + h : v || h);
}
function hud(){
  $("p0").querySelector("span").textContent = scores[0];
  $("p1").querySelector("span").textContent = scores[1];
  $("p0").classList.toggle("on", turn === 0 && !paused);
  $("p1").classList.toggle("on", turn === 1 && !paused);
  var pips = "";
  for (var i = 0; i < BAGS; i++) pips += '<i class="' + (i < BAGS - bagsLeft ? "used" : "") + '"></i>';
  $("bags").innerHTML = pips;
  $("ptsSub").textContent = "round " + frame + " \u00b7 " +
    (bagsLeft === 1 ? "1 bag left" : bagsLeft + " bags left");
}
function bumpScore(){
  var el = $("p" + turn);
  el.classList.add("bump");
  setTimeout(function(){ el.classList.remove("bump"); }, 220);
}

var dismissed = false;
try { dismissed = localStorage.getItem("packet-install-dismissed") === "1"; } catch(e){}

function clean(){
  return (window.matchMedia &&
          window.matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches)
      || navigator.standalone === true
      || !!document.fullscreenElement || !!document.webkitFullscreenElement;
}
function checkChrome(){
  var ok = clean();
  $("oob").classList.toggle("on", !ok);
  var hide = ok || dismissed;
  $("install").classList.toggle("on", !hide);
  if (hide) return;
  $("installText").innerHTML = /iPhone|iPad|iPod/.test(navigator.userAgent)
    ? "Share, then <b>Add to Home Screen</b> for the full screen"
    : "Menu, then <b>Add to Home Screen</b> for the full screen";
}
addEventListener("resize", function(){ setTimeout(checkChrome, 120); });

/* Four bags to a frame, same as the real thing. Board clears between them and
   the total carries over. */
/* Four bags, then the other player steps up. The card also keeps the phone
   safe while you swap places and collect the bags. */
function endFrame(){
  var got = points - frameStart;
  var who = turn;
  appealUntil = 0; pendingDot = null;
  waiting = false; clearRound();
  document.body.className = "";
  $("big").classList.remove("on");
  $("live").style.display = "none";
  beep(520, 120); setTimeout(function(){ beep(780, 200); }, 130);

  paused = true;
  turn = 1 - turn;
  if (turn === 0) frame++;
  bagsLeft = BAGS; frameStart = points;
  hud();

  $("startTitle").innerHTML = "Player " + (turn + 1) + "<br>you're up";
  $("startBody").textContent = "Player " + (who + 1) + " scored " +
    (got === 0 ? "nothing that round." : got + (got === 1 ? " point." : " points."));
  $("startTap").textContent = "Tap anywhere when ready";
  $("startFoot").textContent = "Collect the bags first, then hands off the phone.";
  setTimeout(function(){
    $("dots").innerHTML = ""; lastDot = null;
    $("start").classList.remove("gone");
  }, 900);
}

function idle(){
  waiting = false; clearRound();
  $("live").style.display = "none";
  document.body.className = "";
  $("big").classList.remove("on");
  hud();
}

/* The round was called a loss, then the packet showed up. It was on the phone
   the whole time and the screen was just slow to feel it, so award it now. */
function appeal(px, pos){
  appealUntil = 0;
  var where = target(px);
  if (where === "outside") return;
  var got = where === "hole" ? 3 : 1;
  points += got; scores[turn] += got; wins++; bumpScore();
  plot(pos, where === "hole");
  document.body.className = where === "hole" ? "three" : "win";
  $("big").textContent = got === 3 ? "3!" : String(got);
  $("big").classList.add("on");
  $("why").textContent = "There it is. " + (where === "hole" ? "In the hole." : "On the board.");
  hud();
  if (got === 3) celebrate(); else beep(760, 110);
  setTimeout(function(){ if (!waiting) idle(); }, 1500);
}

/* The bag was already scored, we just did not know where it was sitting.
   Now the screen has felt it, so move it there and draw it properly. */
function placeBag(px, pos){
  if (!pendingDot || !px) return;
  var where = target(px);
  if (where === "outside") return;
  pendingDot.style.left = pos.x + "%";
  pendingDot.style.top  = pos.y + "%";
  pendingDot.className = "dot last " + (where === "hole" ? "h" : "w");
  pendingDot = null; pendingUntil = 0;

  /* It was scored as one point because we did not know where it sat. Now we
     do, and a yellow bag is always worth three, so top it up. */
  if (where === "hole") {
    points += 2; scores[turn] += 2;
    bumpScore(); hud(); celebrate();
    $("why").textContent = "Found the bag. In the hole, that is 3.";
  } else {
    $("why").textContent = "Found the bag. It is in " + zone(pos) + ".";
  }
  setTimeout(function(){ if (!waiting) $("why").textContent = ""; }, 1800);
}

function plot(p, inHole, unknown){
  if (!p) return;
  if (lastDot) lastDot.classList.remove("last");
  var d = document.createElement("div");
  d.className = "dot last " + (unknown ? "u" : inHole ? "h" : "w");
  d.style.left = p.x + "%"; d.style.top = p.y + "%";
  $("dots").appendChild(d);
  lastDot = d;
}

/* ---- round ---- */
function onImpact(m, zShare){
  var t = performance.now();
  if (paused || waiting || t < deafUntil || t - lastImpact < 900) return;
  /* A thrown bag jolts the phone first and touches second. A hand reaching in
     touches first. So a contact that arrived just before this jolt, and is
     still on the glass, means you are picking a bag up rather than landing one.
     Bags already resting from earlier throws touched down long ago, so they do
     not block anything. */
  if (down > 0 && t - lastTouchStart < HAND_WINDOW) return;
  /* A packet lands through the glass, so most of it is on z. A knock to the
     table arrives sideways through the table top. Drop those outright, with
     no round, no flash and no sound. */
  if (zShare < Z_HARD) return;
  clearRound();
  lastImpact = t; roundT0 = t; waiting = true; extended = false; impactMag = m; impactZ = zShare;
  plays++; hud();
  lastContact = 0; firstPos = null; lastPos = null; firstPx = null; lastPx = null; secondHit = 0;
  settled = false; firstContactAt = 0; liftAt = 0;
  appealUntil = 0;
  pendingDot = null; pendingUntil = 0;

  document.body.className = "settle";
  $("big").textContent = "…"; $("big").classList.add("on");
  $("why").textContent = "";
  beep(440, 60);

  BUZZ_AT.forEach(function(ms){ rt(shake, ms); });
  rt(verdict, VERDICT_AT);
  rt(function(){ if (waiting) idle(); }, VERDICT_AT + EXTRA_FOR + 2500);

  poll = setInterval(function(){
    if (!waiting) { clearInterval(poll); return; }
    if (down > 0 || (lastContact && lastContact - roundT0 >= LATE_FROM)) verdict();
  }, 40);
}

function verdict(){
  if (!waiting) return;

  /* Only a round that has felt nothing at all is worth more buzzing. One that
     touched and went quiet is a real bounce, so it gets called now. */
  if (!lastContact && !extended && !secondHit) {
    extended = true;
    timers.forEach(clearTimeout); timers = [];
    $("why").textContent = "still looking";
    EXTRA_BUZZ.forEach(function(ms){ rt(shakeHard, ms); });
    rt(verdict, EXTRA_FOR);
    return;
  }

  /* Sideways energy and nothing on the screen means the table was knocked,
     not the phone. Drop the round entirely rather than scoring it. A landing
     the screen actually felt can never be rejected here. */
  if (!lastContact && impactZ < Z_MIN) {
    waiting = false; clearRound();
    $("live").style.display = "none";
    lastImpact = performance.now();
    plays--; hud();
    document.body.className = "";
    $("big").classList.remove("on");
    $("why").textContent = "Table knock, ignored.";
    setTimeout(function(){ if (!waiting) $("why").textContent = ""; }, 1600);
    return;
  }

  waiting = false; clearRound();
  $("live").style.display = "none";
  lastImpact = performance.now();

  /* No contact at all is no evidence either way. Something hit the phone and
     nothing was ever seen leaving it, so assume it stayed. */
  /* A second thump right after the first means it left and landed elsewhere.
     That is evidence, so it outranks the guess. */
  var flewOff = secondHit > 0;
  /* Held at the end, or still being felt late, is proof it stayed. That beats
     everything. Otherwise any contact at all counts, unless a second thump says
     it left. The cutoff is now only a tiebreaker, not the main test. */
  var certain = down > 0 || (lastContact && lastContact - roundT0 >= LATE_FROM);
  var guessed = !lastContact && !flewOff;
  /* Held at the end, or felt late once the buzzing has started, is proof it is
     sitting there. A brief touch at the moment of impact and nothing after is
     what a bounce looks like, so that is the only case the thump decides. */
  /* A contact that brushed the glass and was gone, before the buzzing even
     started, is a bounce. That comes from the screen, not from guessing at
     what the accelerometer heard. */
  var heldMs = (liftAt && firstContactAt) ? liftAt - firstContactAt : 0;
  var brief = lastContact > 0 && down === 0 && heldMs > 0 && heldMs < BRIEF_MS
              && (lastContact - roundT0) < BUZZ_AT[0];
  var on = certain || !(flewOff || brief);
  var slid = firstPos && lastPos &&
             Math.hypot(lastPos.x - firstPos.x, lastPos.y - firstPos.y) > 12;

  if (on) {
    wins++;
    /* Where it first came down is the truest reading. Anything after that is
       the packet being nudged by the buzzing, or the screen re-acquiring it a
       little off, so a win is scored at the point of impact. */
    var where = guessed ? "unknown" : target(firstPx);
    var got = where === "hole" ? 3 : where === "outside" ? 0 : 1;
    points += got; scores[turn] += got;
    if (got > 0) bumpScore();
    document.body.className = got === 3 ? "three" : "win";
    $("big").textContent = got === 3 ? "3!" : String(got);
    if (got === 3) celebrate();
    /* a dot is a bag resting on the board, so only a scoring one earns it,
       and only when the screen actually told us where it came down */
    /* every point puts a bag on the board. if the screen never gave us a spot,
       it goes mid board as a dashed one so the count always matches. */
    if (got > 0) {
      if (firstPos && !guessed) {
        plot(firstPos, where === "hole", false);
      } else {
        /* No spot yet. Park it mid board and move it the moment the screen
           finally feels the packet, which is what the white ring is showing. */
        plot({ x: 50, y: 62 }, false, true);
        pendingDot = lastDot;
        pendingUntil = performance.now() + PENDING_MS;
      }
    }
    $("why").textContent =
        where === "hole"    ? "In the hole."
      : where === "outside" ? "On the phone but off the board. No points."
      : guessed             ? "Never showed on screen, but it landed square. One point."
                            : "On the board in " + zone(firstPos) + ".";
  } else {
    document.body.className = "lose";
    $("big").textContent = "0";
    appealUntil = performance.now() + APPEAL_MS;
    $("why").textContent = flewOff
      ? "Touched " + zone(firstPos) + ", then landed somewhere else. Bounced off."
      : brief ? "Only on the glass for " + Math.round(heldMs) + "ms. Bounced off."
      : slid  ? "Hit " + zone(firstPos) + ", slid off the edge."
              : "Touched " + zone(firstPos) + " and was gone. Bounced off.";
  }
  $("big").classList.add("on");
  hud();
  if (!(on && document.body.className === "three")) beep(on ? 760 : 200, 100);
  bagsLeft--;
  hud();
  if (bagsLeft <= 0) rt(endFrame, 1700); else rt(idle, 1500);
}

/* ---- sensors ---- */
function motion(ax, ay, az){
  var m = Math.sqrt(ax*ax + ay*ay + az*az);
  if (waiting) {
    var age = performance.now() - roundT0;
    /* mark that the phone actually settled after the landing, rather than
       demanding a silence quieter than the sensor's own noise floor */
    if (age > BLANK_MS && m < Math.max(0.05, ACC_THR * 0.35)) settled = true;
    /* Landing on the table arrives through the table top, heavily damped, so
       it is always much softer than the direct hit. Listen well below the
       trigger, but still demand a fresh transient rather than ringdown. */
    if (!secondHit && settled && age < LISTEN_MS
        && m > Math.max(0.05, ACC_THR * 0.35)) secondHit = m;
    return;                       // a round in flight is never restarted
  }
  if (m > ACC_THR) onImpact(m, Math.abs(az) / m);
}


function startMotion(){
  if (window.LinearAccelerationSensor) {
    try {
      var a = new LinearAccelerationSensor({frequency:200});
      a.onreading = function(){ motion(a.x, a.y, a.z); };
      a.onerror = dm; a.start(); return;
    } catch(e){}
  }
  dm();
}
function dm(){
  function bind(){
    addEventListener("devicemotion", function(e){
      var a = e.acceleration;
      if (!a || a.x === null) return;
      motion(a.x||0, a.y||0, a.z||0);
    });
  }
  if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission)
    DeviceMotionEvent.requestPermission().then(bind).catch(function(){});
  else bind();
}

/* ---- touch ---- */
function contact(t){
  lastContact = performance.now();
  lastPos = { x: +(t.clientX/innerWidth*100).toFixed(1),
              y: +(t.clientY/innerHeight*100).toFixed(1) };
  lastPx = { x: t.clientX, y: t.clientY };
  if (!firstPos) { firstPos = lastPos; firstPx = lastPx; firstContactAt = lastContact; }
  if (!waiting && performance.now() < appealUntil) appeal(lastPx, lastPos);
  else if (!waiting && pendingDot && performance.now() < pendingUntil) placeBag(lastPx, lastPos);
  var lv = $("live");
  lv.style.left = t.clientX + "px"; lv.style.top = t.clientY + "px";
  lv.style.display = waiting ? "block" : "none";
}
document.addEventListener("touchstart", function(e){
  if (e.target.tagName === "BUTTON" || e.target.closest("#install")) return;
  e.preventDefault();
  if (paused) {
    paused = false;
    $("start").classList.add("gone");
    deafUntil = performance.now() + ARM_QUIET;
    lastTouchStart = performance.now();
    idle();
    return;
  }
  if (!armed) {
    armed = true;
    try { ctx = new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); } catch(err){}
    startMotion();
    goFullscreen();
    $("start").classList.add("gone");
    /* quiet for a moment so your finger leaving the glass is not a throw */
    deafUntil = performance.now() + ARM_QUIET;
    idle();
    if (!navigator.vibrate) $("why").textContent = "no vibrate api on this browser";
    return;
  }
  down = e.touches.length;
  if (!waiting) lastTouchStart = performance.now();
  var t0 = e.changedTouches[0];
  touchOrigin = { x: t0.clientX, y: t0.clientY }; touchMoved = 0;
  contact(t0);
}, {passive:false});
document.addEventListener("touchmove", function(e){
  if (e.target.tagName === "BUTTON" || e.target.closest("#install")) return;
  e.preventDefault();
  var t = e.changedTouches[0];
  if (touchOrigin) {
    var d = Math.hypot(t.clientX - touchOrigin.x, t.clientY - touchOrigin.y);
    if (d > touchMoved) touchMoved = d;
  }
  if (waiting) contact(t);
}, {passive:false});
function lift(e){
  if (e.target.tagName === "BUTTON" || e.target.closest("#install")) return;
  e.preventDefault();
  down = e.touches.length;
  /* A packet being lifted drags across the glass on the way up, and that jolt
     would otherwise open a fresh round and score the same bag twice. A packet
     the screen simply lost never moves, so it does not blind anything. */
  if (down === 0 && waiting) liftAt = performance.now();
  if (down === 0 && touchMoved > PICKUP_PX) {
    deafUntil = Math.max(deafUntil, performance.now() + PICKUP_TAIL);
    appealUntil = 0;
  }
  if (down === 0) { touchOrigin = null; touchMoved = 0; }
}
document.addEventListener("touchend", lift, {passive:false});
document.addEventListener("touchcancel", lift, {passive:false});

/* ---- corners ---- */
if ("serviceWorker" in navigator)
  addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" })
      .then(function(reg){ reg.update(); })
      .catch(function(){});
    var reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if (reloaded) return;
      reloaded = true;
      location.reload();          // a new build took over, show it straight away
    });
  });

document.addEventListener("DOMContentLoaded", function(){
  var b = $("dismiss");
  if (!b) return;
  b.addEventListener("click", function(e){
    e.stopPropagation();
    dismissed = true;
    try { localStorage.setItem("packet-install-dismissed", "1"); } catch(err){}
    $("install").classList.remove("on");
  });
});

function goFullscreen(){
  var el = document.documentElement;
  var fs = el.requestFullscreen || el.webkitRequestFullscreen;
  if (fs) { try { var p = fs.call(el); if (p && p.then) p.then(checkChrome, checkChrome); } catch(err){} }
  setTimeout(checkChrome, 400);
}
checkChrome();

$("clear").addEventListener("click", function(e){
  e.stopPropagation();
  goFullscreen();
  $("dots").innerHTML = ""; lastDot = null; pendingDot = null; pendingUntil = 0;
  frame = 1; bagsLeft = BAGS; frameStart = 0;
  scores = [0, 0]; turn = 0;
  wins = 0; plays = 0; points = 0; hud();
  $("why").textContent = "";
});

})();
</script>
</body>
</html>
