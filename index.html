<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pocket Cornhole</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket Cornhole">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="./manifest.webmanifest">
<style>
  /* ===============================================================
     Pocket Cornhole
     A tournament board seen from directly above. Painted frame rails
     at each end carry all the type, so nothing legible ever sits on
     wood grain. Everything below is built from the tokens.
     =============================================================== */
  :root {
    /* surfaces, darkest to lightest */
    --ink:    #0A1B2A;
    --rail:   #14304A;
    --panel:  #1B4066;
    /* stained birch */
    --ply-1:  #D6A566;
    --ply-2:  #BE8442;
    --ply-3:  #9A6529;
    --void:   #1A1108;
    /* chalk, three steps of emphasis */
    --chalk:  #F4EFE4;
    --chalk-2:#B4C2CF;
    --chalk-3:#728699;
    /* duck canvas and the reward */
    --p1:     #2F7FC9;
    --p1-lit: #7FBBF0;
    --p2:     #D2621C;
    --p2-lit: #F0A468;
    --gold:   #F0B429;
    --bad:    #C0392B;

    --line:   rgba(244,239,228,.13);
    --line-2: rgba(244,239,228,.26);
    --lift:   0 16px 36px -14px rgba(0,0,0,.85);

    --r-xs: 3px; --r-sm: 6px; --r-md: 10px; --r-lg: 16px; --r-pill: 999px;

    /* one family, six sizes, nothing between */
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --t-xs: 11px; --t-sm: 13px; --t-md: 15px;
    --t-lg: 22px; --t-xl: 27px; --t-2xl: 42px;

    --rail-h: 15%;
    --foot-h: 12%;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--ink);
    color: var(--chalk); font-family: var(--sans);
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  button { font-family: var(--sans); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---------- one button shape, three intents ---------- */
  .btn {
    display: block; width: 100%; padding: 13px 16px; border-radius: var(--r-md);
    border: 1.5px solid var(--line-2); background: rgba(244,239,228,.06);
    color: var(--chalk); font-size: var(--t-md); font-weight: 800;
    letter-spacing: -.01em;
  }
  .btn-go     { background: rgba(240,180,41,.16); border-color: var(--gold); color: var(--gold); }
  .btn-danger { background: rgba(192,57,43,.18);  border-color: var(--bad);  color: #FFC9C2; }

  /* ---------- the play surface ---------- */
  #board {
    position: fixed; left: 0; right: 0;
    top: var(--rail-h); bottom: var(--foot-h); z-index: 0;
    pointer-events: none; overflow: hidden;
    box-shadow: inset 0 14px 22px -14px rgba(0,0,0,.85),
                inset 0 -14px 22px -14px rgba(0,0,0,.85);
    background:
      repeating-linear-gradient(91deg, rgba(88,52,18,.13) 0 1px, transparent 1px 6px),
      repeating-linear-gradient(89deg, rgba(255,236,205,.10) 0 1px, transparent 1px 19px),
      linear-gradient(102deg, rgba(255,255,255,.10) 0%, rgba(0,0,0,.10) 55%, rgba(0,0,0,.20) 100%),
      linear-gradient(180deg, var(--ply-1) 0%, var(--ply-2) 52%, var(--ply-3) 100%);
    transition: filter .2s ease;
  }
  #board::after {                       /* plank seams */
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(180deg,
      transparent 0 25%, rgba(74,42,12,.34) 25% calc(25% + 2px));
  }
  #board::before {                      /* the chalked side lines */
    content: ""; position: absolute; left: 4%; right: 4%; top: 0; bottom: 0;
    border-left: 2px solid rgba(255,247,232,.16);
    border-right: 2px solid rgba(255,247,232,.16);
  }
  #hole {
    position: fixed; left: 50%; top: 34%; width: 40%; aspect-ratio: 1; z-index: 1;
    transform: translate(-50%,-50%); border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 50% 30%, #2A1B0B 0%, #170E05 44%, var(--void) 100%);
    box-shadow: inset 0 10px 18px rgba(0,0,0,.95),
                inset 0 -4px 9px rgba(214,165,102,.34),
                0 2px 0 rgba(255,240,214,.14);
  }

  /* ---------- bags ---------- */
  #dots { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .dot {
    position: absolute; width: 40px; height: 34px; margin: -17px 0 0 -20px;
    border-radius: var(--r-sm);
    box-shadow: 0 4px 7px -2px rgba(28,14,2,.7),
                inset 0 -5px 9px rgba(0,0,0,.30),
                inset 0 4px 7px rgba(255,255,255,.20);
  }
  .dot::after {                         /* stitched seam */
    content: ""; position: absolute; inset: 4px; border-radius: var(--r-xs);
    border: 1px dashed rgba(255,255,255,.40);
  }
  .dot.w  { background: linear-gradient(155deg, var(--p1-lit), #1F5F9E); }
  .dot.h  { background: linear-gradient(155deg, var(--p2-lit), #A8480D); }
  .dot.in { width: 31px; height: 27px; margin: -13px 0 0 -15px;
            filter: brightness(.46) saturate(.75); z-index: 0; }
  .dot.u  { background: repeating-linear-gradient(45deg,
              rgba(244,239,228,.22) 0 5px, rgba(244,239,228,.07) 5px 10px);
            box-shadow: none; }
  .dot.u::after { border-color: rgba(244,239,228,.5); }
  .dot.last { outline: 2px solid rgba(255,247,232,.9); outline-offset: 3px; }
  #live {
    position: fixed; width: 46px; height: 40px; margin: -20px 0 0 -23px;
    border: 2px dashed rgba(255,247,232,.92); border-radius: var(--r-sm); z-index: 3;
    pointer-events: none; display: none;
  }

  /* ---------- top rail: the scoreboard ---------- */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; height: var(--rail-h); z-index: 6;
    padding: calc(3px + env(safe-area-inset-top)) 10px 6px;
    display: flex; flex-direction: column; justify-content: center; gap: 5px;
    background: linear-gradient(180deg, var(--panel), var(--rail));
    box-shadow: 0 3px 0 rgba(0,0,0,.3);
    pointer-events: none;
  }
  #scores { display: flex; align-items: stretch; justify-content: center; gap: 8px; }
  #vs { align-self: center; font-size: var(--t-xs); font-weight: 800;
        color: var(--chalk-3); letter-spacing: .1em; }
  .pl {
    flex: 1 1 0; max-width: 40%; padding: 4px 10px 5px; border-radius: var(--r-sm);
    background: rgba(244,239,228,.06); border: 1.5px solid transparent;
    display: flex; align-items: baseline; justify-content: center; gap: 8px;
    opacity: .42; transition: opacity .2s ease, background .2s ease, border-color .2s ease;
  }
  .pl b { font-size: var(--t-xs); font-weight: 700; }
  .pl .n {
    font-size: var(--t-xl); font-weight: 800; letter-spacing: -.045em; line-height: 1;
    font-variant-numeric: tabular-nums; color: var(--chalk);
    transition: transform .18s cubic-bezier(.2,1.6,.4,1), color .18s ease;
  }
  #p0 b { color: var(--p1-lit); }
  #p1 b { color: var(--p2-lit); }
  #p0.on { opacity: 1; background: rgba(47,127,201,.22); border-color: var(--p1); }
  #p1.on { opacity: 1; background: rgba(210,98,28,.22); border-color: var(--p2); }
  .pl.bump .n { transform: scale(1.3); color: var(--gold); }
  .pl .pips { display: flex; gap: 4px; }
  .pl .pips i { width: 10px; height: 8px; border-radius: var(--r-xs); }
  #p0 .pips i { background: var(--p1); }
  #p1 .pips i { background: var(--p2); }
  .pl .pips i.used { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(244,239,228,.3); }
  #ptsSub { text-align: center; font-size: var(--t-xs); font-weight: 600; color: var(--chalk-2); }
  #scores.solo #p1, #scores.solo #vs { display: none; }
  #scores.solo .pl { max-width: 62%; }

  /* ---------- bottom rail: the caller ---------- */
  #why {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--foot-h); z-index: 6;
    padding: 0 46px calc(2px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(0deg, var(--panel), var(--rail));
    box-shadow: 0 -3px 0 rgba(0,0,0,.3);
    font-size: var(--t-sm); font-weight: 600; line-height: 1.35; color: var(--chalk-2);
    pointer-events: none;
  }

  /* ---------- the verdict, always on a plate ---------- */
  #big {
    position: fixed; inset: var(--rail-h) 0 var(--foot-h) 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0; transition: opacity .1s linear;
  }
  #big.on { opacity: 1; }
  #big span {
    display: block; padding: 12px 30px 14px; border-radius: var(--r-md);
    background: rgba(10,27,42,.92); border: 2px solid var(--line-2);
    box-shadow: var(--lift);
    font-size: 21vw; font-weight: 800; letter-spacing: -.05em; line-height: .92;
    color: var(--chalk); font-variant-numeric: tabular-nums;
  }
  #big.huge span { font-size: 11vw; letter-spacing: -.02em; padding: 14px 22px 15px; }
  body.three #big span { background: rgba(58,40,4,.94); border-color: var(--gold); color: var(--gold); }
  body.lose  #big span { background: rgba(56,14,10,.94); border-color: var(--bad);  color: #FFC9C2; }

  body.win    #board { filter: saturate(1.15) brightness(1.10); }
  body.three  #board { filter: saturate(1.30) brightness(1.28); }
  body.lose   #board { filter: saturate(.55) brightness(.72); }
  body.settle #board { filter: brightness(.9); }

  body.three #hole { animation: sink 620ms cubic-bezier(.2,1.5,.35,1); }
  @keyframes sink {
    0%   { transform: translate(-50%,-50%) scale(1); }
    38%  { transform: translate(-50%,-50%) scale(1.14); }
    100% { transform: translate(-50%,-50%) scale(1); }
  }
  body.lose #board, body.lose #dots { animation: badshake 480ms cubic-bezier(.36,.07,.19,.97); }
  @keyframes badshake {
    0%,100%     { transform: translateX(0); }
    14%,42%,70% { transform: translateX(-10px); }
    28%,56%,84% { transform: translateX(10px); }
  }

  #burst { position: fixed; inset: 0; z-index: 7; pointer-events: none; overflow: hidden; }
  .bit { position: absolute; width: 11px; height: 11px; margin: -5px 0 0 -5px;
         border-radius: var(--r-xs); opacity: 0;
         animation: fly 900ms cubic-bezier(.15,.7,.3,1) forwards; }
  @keyframes fly {
    0%   { opacity: 1; transform: translate(0,0) scale(.5) rotate(0deg); }
    70%  { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(var(--rot)); }
  }

  /* ---------- overlays share one surface ---------- */
  #start, #confirm {
    position: fixed; inset: 0; z-index: 9;
    display: flex; align-items: center; justify-content: center;
  }
  #start {
    flex-direction: column; gap: 20px; padding: 0 28px; text-align: center;
    background:
      radial-gradient(120% 70% at 50% 34%, rgba(27,64,102,.55) 0%, transparent 72%),
      linear-gradient(180deg, var(--rail) 0%, var(--ink) 100%);
  }
  #start.gone { display: none; }
  #startTitle { margin: 0; font-size: var(--t-2xl); line-height: .96; font-weight: 800;
                letter-spacing: -.045em; color: var(--chalk); }
  #startBody  { margin: 0; max-width: 24ch; color: var(--chalk-2);
                font-size: var(--t-md); font-weight: 500; line-height: 1.5; }
  #startFoot  { color: var(--chalk-3); font-size: var(--t-xs); font-weight: 500; }
  #modes { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; }
  #modes .btn { display: flex; align-items: center; gap: 14px; text-align: left; }
  #modes .btn svg { flex: none; width: 38px; height: 28px; }
  #modes .btn span { display: block; margin-top: 2px; font-size: var(--t-xs); font-weight: 600; }
  #m1 { border-color: rgba(47,127,201,.55); } #m1 span { color: var(--p1-lit); }
  #m2 { border-color: rgba(210,98,28,.55); }  #m2 span { color: var(--p2-lit); }
  #startTap { width: auto; padding: 14px 34px; border-radius: var(--r-pill);
              animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe {
    0%,100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(240,180,41,.34); }
    50%     { transform: scale(1.04); box-shadow: 0 0 0 15px rgba(240,180,41,0); }
  }
  .hide { display: none !important; }

  #confirm { z-index: 10; display: none; padding: 26px; background: rgba(6,14,22,.84); }
  #confirm.on { display: flex; }
  #confirm .sheet {
    width: 100%; max-width: 320px; padding: 22px 20px 16px; border-radius: var(--r-lg);
    background: linear-gradient(180deg, var(--panel), var(--rail));
    border: 1.5px solid var(--line-2); text-align: center; box-shadow: var(--lift);
  }
  #confirm h2 { margin: 0 0 6px; font-size: var(--t-lg); font-weight: 800;
                letter-spacing: -.03em; color: var(--chalk); }
  #confirm p  { margin: 0 0 18px; font-size: var(--t-sm); font-weight: 500;
                line-height: 1.45; color: var(--chalk-2); }
  #confirmYes { margin-bottom: 8px; }

  /* ---------- small chrome ---------- */
  #clear {
    position: fixed; top: calc(4px + env(safe-area-inset-top)); left: 7px;
    width: 36px; height: 36px; padding: 0; border-radius: var(--r-sm); z-index: 8;
    background: rgba(244,239,228,.08); color: var(--chalk-2);
    border: 1px solid var(--line); font-size: var(--t-xs); font-weight: 700;
  }
  #oob { display: none; }
  #install {
    position: fixed; bottom: calc(4px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%); z-index: 8; display: none;
    max-width: 90%; align-items: center; gap: 8px;
    padding: 5px 6px 5px 12px; border-radius: var(--r-pill);
    background: var(--rail); border: 1px solid var(--line-2);
    color: var(--chalk-2); font-size: var(--t-xs); font-weight: 500; line-height: 1.3;
  }
  #install.on { display: flex; }
  #install b { font-weight: 700; color: var(--chalk); }
  #dismiss { width: 21px; height: 21px; flex: none; padding: 0; border-radius: 50%;
             background: rgba(244,239,228,.14); color: var(--chalk-2);
             border: 0; font-size: var(--t-xs); line-height: 1; }
  #build {
    position: fixed; right: 7px; bottom: calc(5px + env(safe-area-inset-bottom));
    z-index: 8; pointer-events: none; padding: 2px 6px; border-radius: var(--r-xs);
    background: rgba(0,0,0,.34); color: var(--chalk-3);
    font: 600 10px ui-monospace, Menlo, monospace;
  }

  @media (prefers-reduced-motion: reduce) {
    #startTap, .bit, body.three #hole,
    body.lose #board, body.lose #dots { animation: none; }
  }
</style>
</head>
<body>
  <div id="oob"></div>
  <div id="board"></div>
  <div id="hole"></div>
  <div id="dots"></div>
  <div id="live"></div>
  <div id="burst"></div>
  <div id="start">
    <h1 id="startTitle">Pocket<br>Cornhole</h1>
    <p id="startBody">Lay the phone flat, screen up. Throw a foil-wrapped sugar packet at it.</p>
        <div id="modes">
      <button class="btn" id="m1"><svg viewBox="0 0 40 30" aria-hidden="true"><circle cx="20" cy="9" r="5.4" fill="#5aa9ff"/><path d="M9.5 27c0-5.8 4.7-9.5 10.5-9.5S30.5 21.2 30.5 27z" fill="#5aa9ff"/></svg><div>Practice<span>one player</span></div></button>
      <button class="btn" id="m2"><svg viewBox="0 0 40 30" aria-hidden="true"><circle cx="12" cy="10" r="4.8" fill="#5aa9ff"/><path d="M2.5 27c0-5.2 4.2-8.6 9.5-8.6s9.5 3.4 9.5 8.6z" fill="#5aa9ff"/><circle cx="28" cy="10" r="4.8" fill="#ff9d42"/><path d="M18.5 27c0-5.2 4.2-8.6 9.5-8.6s9.5 3.4 9.5 8.6z" fill="#ff9d42"/></svg><div>Head to head<span>two players</span></div></button>
    </div>
    <button class="btn btn-go hide" id="startTap">Tap when ready</button>
    <small id="startFoot">Then hands off the phone for a moment.</small>
  </div>
  <div id="build">b46</div>
  <div id="big"><span id="bigText"></span></div>
    <div id="hud">
    <div id="scores">
      <div class="pl" id="p0"><b>Player 1</b><span class="n">0</span><span class="pips"></span></div>
      <div id="vs">VS</div>
      <div class="pl" id="p1"><b>Player 2</b><span class="n">0</span><span class="pips"></span></div>
    </div>
    <span id="ptsSub"></span>
  </div>
  <div id="why"></div>
  <div id="install"><span id="installText"></span><button id="dismiss">&times;</button></div>
  <button id="clear">exit</button>
  <div id="confirm">
    <div class="sheet">
      <h2 id="confirmTitle">End the game?</h2>
      <p id="confirmBody">The score and every bag on the board will be lost.</p>
      <button class="btn btn-danger" id="confirmYes">End game</button>
      <button class="btn" id="confirmNo">Keep playing</button>
    </div>
  </div>

<script>
(function(){
"use strict";
var $ = function(i){ return document.getElementById(i); };

/* The buzz drowns out everything, so it waits. A bounced packet needs time to
   travel and land, and the phone has to be quiet to hear it arrive. */
var LISTEN_MS  = 850;   // quiet window, listening for it landing somewhere else
var BLANK_MS   = 200;   // the landing itself rings for longer than you would think
var BUZZ_AT    = [850, 1050, 1250, 1470, 1700];
var VERDICT_AT = 2000;
var LATE_FROM  = 950;   // was the med step of the bounce dial
var EXTRA_BUZZ = [0, 350, 700], EXTRA_FOR = 1100;
var ARM_QUIET  = 2000;          // silent, no countdown on screen
var BUZZ_DUR   = 300, BUZZ_TAIL = 200;
var ACC_THR    = 0.30;  // was the med step of the trigger dial

var armed = false, ctx = null, waiting = false, extended = false;
var wins = 0, plays = 0;
var lastImpact = -1e9, deafUntil = 0;
var down = 0, lastContact = 0, firstPos = null, lastPos = null;
var roundT0 = 0, timers = [], poll = null, lastDot = null, impactMag = 0;
var secondHit = 0;      // it came off and hit something else
var settled = false;    // the phone went quiet after the landing
var firstContactAt = 0, liftAt = 0;
var BRIEF_MS = 300;     // a bounce brushes the glass, it does not rest on it
var points = 0, firstPx = null, lastPx = null;
var BAGS = 4, bagsLeft = BAGS, frame = 1, frameStart = 0;
var scores = [0, 0], turn = 0, paused = false, players = 1;
var impactZ = 1;          // how much of the hit went straight down through the glass
var Z_HARD = 0.34;        // clearly sideways. never even opens a round.
var Z_MIN  = 0.55;        // borderline. opens one, but dropped if nothing lands.
var appealUntil = 0;      // a lost round can still be put right if it turns up
var touchOrigin = null, touchMoved = 0;   // telling a pickup from a quiet drop
var lastTouchStart = -1e9;                // when something newly arrived on the glass
var HAND_WINDOW = 1400;                   // a contact this fresh, still down, is a hand
var pendingDot = null, pendingUntil = 0;  // a bag placed before we knew its spot
var PENDING_MS = 8000;
var PICKUP_PX  = 14;      // a lifted packet drags this far, a dropped one does not
var PICKUP_TAIL = 900;    // stay deaf that long after a hand has been on the glass
var APPEAL_MS = 5000;

function beep(f, ms){
  if (!ctx) return;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "square"; o.frequency.value = f; g.gain.value = .22;
  o.connect(g); g.connect(ctx.destination); o.start();
  g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + ms/1000);
  o.stop(ctx.currentTime + ms/1000);
}
/* A miss should feel like one. Low sawtooth blast, a shove, and a long buzz. */
function boo(){
  if (ctx) {
    [[150, 0, 260], [110, 190, 420]].forEach(function(n){
      setTimeout(function(){
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sawtooth"; o.frequency.value = n[0]; g.gain.value = .3;
        o.connect(g); g.connect(ctx.destination); o.start();
        o.frequency.exponentialRampToValueAtTime(n[0] * 0.55, ctx.currentTime + n[2] / 1000);
        g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + n[2] / 1000);
        o.stop(ctx.currentTime + n[2] / 1000);
      }, n[1]);
    });
  }
  if (navigator.vibrate) {
    navigator.vibrate([260, 90, 260]);
    deafUntil = performance.now() + 900;
  }
}

function celebrate(){
  var W = innerWidth, H = innerHeight;
  var cx = W * 0.5, cy = H * 0.34;
  var cols = ["#F0B429", "#F4EFE4", "#2F7FC9", "#D2621C"];
  var frag = document.createDocumentFragment();
  for (var i = 0; i < 44; i++) {
    var a = (Math.PI * 2 * i) / 44 + Math.random() * 0.35;
    var dist = 110 + Math.random() * 240;
    var b = document.createElement("div");
    b.className = "bit";
    b.style.left = cx + "px"; b.style.top = cy + "px";
    b.style.background = cols[i % cols.length];
    b.style.setProperty("--dx", Math.cos(a) * dist + "px");
    b.style.setProperty("--dy", Math.sin(a) * dist + "px");
    b.style.setProperty("--rot", Math.round(Math.random() * 540 - 270) + "deg");
    b.style.animationDelay = Math.round(Math.random() * 90) + "ms";
    frag.appendChild(b);
  }
  $("burst").appendChild(frag);
  setTimeout(function(){ $("burst").innerHTML = ""; }, 1200);

  [[523,0],[659,90],[784,180],[1047,270],[1319,380],[1568,500]].forEach(function(n){
    setTimeout(function(){ beep(n[0], 240); }, n[1]);
  });
  if (navigator.vibrate) {
    navigator.vibrate([90,50,90,50,90,50,260]);
    deafUntil = performance.now() + 1100;   // do not hear our own party
  }
}

function shake(){
  if (!navigator.vibrate) return;
  navigator.vibrate([45,35,45,35,45,35,60]);
  deafUntil = performance.now() + BUZZ_DUR + BUZZ_TAIL;
}
function shakeHard(){
  if (!navigator.vibrate) return;
  navigator.vibrate(500);
  deafUntil = performance.now() + 500 + BUZZ_TAIL;
}
function rt(fn, ms){ timers.push(setTimeout(fn, ms)); }
function clearRound(){ timers.forEach(clearTimeout); timers = []; clearInterval(poll); poll = null; }

/* which part of the board it came down on */
/* These match the rails in the stylesheet. The top rail ends at 15% and the
   bottom one starts at 88%, so the wood between them is the scoring board and
   the chrome costs no play surface. */
var RAIL_TOP = 0.15, RAIL_BOT = 0.88, EDGE = 0.04;
function target(px){
  if (!px) return "unknown";
  var W = innerWidth, H = innerHeight;
  var hx = W * 0.5, hy = H * 0.34, hr = W * 0.20;
  if (Math.hypot(px.x - hx, px.y - hy) <= hr) return "hole";
  var inBoard = px.x > W * EDGE && px.x < W * (1 - EDGE)
             && px.y > H * RAIL_TOP && px.y < H * RAIL_BOT;
  return inBoard ? "board" : "outside";
}

function zone(p){
  if (!p) return "nowhere";
  var h = p.x < 34 ? "left" : p.x < 67 ? "" : "right";
  var v = p.y < 34 ? "top" : p.y < 67 ? "" : "bottom";
  if (!h && !v) return "the middle";
  return "the " + (v && h ? v + " " + h : v || h);
}
function hud(){
  var pips = "";
  for (var i = 0; i < BAGS; i++)
    pips += '<i class="' + (i < BAGS - bagsLeft ? "used" : "") + '"></i>';
  [0, 1].forEach(function(n){
    var el = $("p" + n), active = (turn === n && !paused);
    el.querySelector(".n").textContent = scores[n];
    el.querySelector(".pips").innerHTML = active ? pips : "";
    el.classList.toggle("on", active);
  });
  $("ptsSub").textContent = paused
    ? "round " + frame
    : "Player " + (turn + 1) + " throwing \u00b7 round " + frame + " \u00b7 " +
      (bagsLeft === 1 ? "1 bag left" : bagsLeft + " bags left");
}
function bumpScore(){
  var el = $("p" + turn);
  el.classList.add("bump");
  setTimeout(function(){ el.classList.remove("bump"); }, 220);
}

var dismissed = false;
try { dismissed = localStorage.getItem("packet-install-dismissed") === "1"; } catch(e){}

function clean(){
  return (window.matchMedia &&
          window.matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches)
      || navigator.standalone === true
      || !!document.fullscreenElement || !!document.webkitFullscreenElement;
}
function checkChrome(){
  var ok = clean();
  $("oob").classList.toggle("on", !ok);
  var hide = ok || dismissed;
  $("install").classList.toggle("on", !hide);
  if (hide) return;
  $("installText").innerHTML = /iPhone|iPad|iPod/.test(navigator.userAgent)
    ? "Share, then <b>Add to Home Screen</b> for the full screen"
    : "Menu, then <b>Add to Home Screen</b> for the full screen";
}
addEventListener("resize", function(){ setTimeout(checkChrome, 120); });

/* Four bags to a frame, same as the real thing. Board clears between them and
   the total carries over. */
/* Four bags, then the other player steps up. The card also keeps the phone
   safe while you swap places and collect the bags. */
function endFrame(){
  var got = points - frameStart;
  var who = turn;
  appealUntil = 0; pendingDot = null;
  waiting = false; clearRound();
  document.body.className = "";
  $("big").classList.remove("on");
  $("live").style.display = "none";
  beep(520, 120); setTimeout(function(){ beep(780, 200); }, 130);

  paused = true;
  if (players === 2) { turn = 1 - turn; if (turn === 0) frame++; }
  else frame++;
  bagsLeft = BAGS; frameStart = points;
  hud();

  $("startTitle").innerHTML = players === 2
    ? "Player " + (turn + 1) + "<br>you're up"
    : "Round " + frame;
  $("startBody").textContent = players === 2
    ? "Player " + (who + 1) + " scored " +
      (got === 0 ? "nothing that round." : got + (got === 1 ? " point." : " points.")) 
    : (got === 0 ? "No points that round." : got + (got === 1 ? " point" : " points") +
       " from four bags. " + scores[0] + " in total.");
  $("modes").classList.add("hide");
  $("startTap").classList.remove("hide");
  $("startTap").textContent = "Tap when ready";
  $("startFoot").textContent = "Collect the bags first, then hands off the phone.";
  setTimeout(function(){
    $("dots").innerHTML = ""; lastDot = null;
    $("start").classList.remove("gone");
  }, 900);
}

function startGame(n){
  players = n;
  armed = true;
  $("scores").classList.toggle("solo", players === 1);
  try { ctx = new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); } catch(err){}
  startMotion();
  goFullscreen();
  $("start").classList.add("gone");
  deafUntil = performance.now() + ARM_QUIET;
  lastTouchStart = performance.now();
  idle();
  if (!navigator.vibrate) $("why").textContent = "no vibrate api on this browser";
}

function idle(){
  waiting = false; clearRound();
  $("live").style.display = "none";
  document.body.className = "";
  $("big").classList.remove("on");
  hud();
}

/* The round was called a loss, then the packet showed up. It was on the phone
   the whole time and the screen was just slow to feel it, so award it now. */
function appeal(px, pos){
  appealUntil = 0;
  var where = target(px);
  if (where === "outside") return;
  var got = where === "hole" ? 3 : 1;
  points += got; scores[turn] += got; wins++; bumpScore();
  plot(pos, where === "hole");
  document.body.className = where === "hole" ? "three" : "win";
  $("bigText").textContent = got === 3 ? "3!" : String(got);
  $("big").classList.add("on");
  $("why").textContent = "There it is. " + (where === "hole" ? "In the hole." : "On the board.");
  hud();
  if (got === 3) celebrate(); else beep(760, 110);
  setTimeout(function(){ if (!waiting) idle(); }, 1500);
}

/* The bag was already scored, we just did not know where it was sitting.
   Now the screen has felt it, so move it there and draw it properly. */
function placeBag(px, pos){
  if (!pendingDot || !px) return;
  var where = target(px);
  if (where === "outside") return;
  pendingDot.style.left = pos.x + "%";
  pendingDot.style.top  = pos.y + "%";
  pendingDot.className = "dot last " + (turn === 0 ? "w" : "h") + (where === "hole" ? " in" : "");
  pendingDot.style.transform = "rotate(" + (Math.random() * 34 - 17).toFixed(1) + "deg)";
  pendingDot = null; pendingUntil = 0;

  /* It was scored as one point because we did not know where it sat. Now we
     do, and a yellow bag is always worth three, so top it up. */
  if (where === "hole") {
    points += 2; scores[turn] += 2;
    bumpScore(); hud(); celebrate();
    $("why").textContent = "Found the bag. In the hole, that is 3.";
  } else {
    $("why").textContent = "Found the bag. It is in " + zone(pos) + ".";
  }
  setTimeout(function(){ if (!waiting) $("why").textContent = ""; }, 1800);
}

function plot(p, inHole, unknown){
  if (!p) return;
  if (lastDot) lastDot.classList.remove("last");
  var d = document.createElement("div");
  /* blue bags for player one, orange for player two, whichever board they land on */
  d.className = "dot last " + (unknown ? "u" : turn === 0 ? "w" : "h") + (inHole ? " in" : "");
  d.style.transform = "rotate(" + (Math.random() * 34 - 17).toFixed(1) + "deg)";
  d.style.left = p.x + "%"; d.style.top = p.y + "%";
  $("dots").appendChild(d);
  lastDot = d;
}

/* ---- round ---- */
function onImpact(m, zShare){
  var t = performance.now();
  if (paused || waiting || t < deafUntil || t - lastImpact < 900) return;
  /* A thrown bag jolts the phone first and touches second. A hand reaching in
     touches first. So a contact that arrived just before this jolt, and is
     still on the glass, means you are picking a bag up rather than landing one.
     Bags already resting from earlier throws touched down long ago, so they do
     not block anything. */
  if (down > 0 && t - lastTouchStart < HAND_WINDOW) return;
  /* A packet lands through the glass, so most of it is on z. A knock to the
     table arrives sideways through the table top. Drop those outright, with
     no round, no flash and no sound. */
  if (zShare < Z_HARD) return;
  clearRound();
  lastImpact = t; roundT0 = t; waiting = true; extended = false; impactMag = m; impactZ = zShare;
  plays++; hud();
  lastContact = 0; firstPos = null; lastPos = null; firstPx = null; lastPx = null; secondHit = 0;
  settled = false; firstContactAt = 0; liftAt = 0;
  appealUntil = 0;
  pendingDot = null; pendingUntil = 0;

  document.body.className = "settle";
  $("bigText").textContent = "…"; $("big").classList.add("on");
  $("why").textContent = "";
  beep(440, 60);

  BUZZ_AT.forEach(function(ms){ rt(shake, ms); });
  rt(verdict, VERDICT_AT);
  rt(function(){ if (waiting) idle(); }, VERDICT_AT + EXTRA_FOR + 2500);

  poll = setInterval(function(){
    if (!waiting) { clearInterval(poll); return; }
    if (down > 0 || (lastContact && lastContact - roundT0 >= LATE_FROM)) verdict();
  }, 40);
}

function verdict(){
  if (!waiting) return;

  /* Only a round that has felt nothing at all is worth more buzzing. One that
     touched and went quiet is a real bounce, so it gets called now. */
  if (!lastContact && !extended && !secondHit) {
    extended = true;
    timers.forEach(clearTimeout); timers = [];
    $("why").textContent = "still looking";
    EXTRA_BUZZ.forEach(function(ms){ rt(shakeHard, ms); });
    rt(verdict, EXTRA_FOR);
    return;
  }

  /* Sideways energy and nothing on the screen means the table was knocked,
     not the phone. Drop the round entirely rather than scoring it. A landing
     the screen actually felt can never be rejected here. */
  if (!lastContact && impactZ < Z_MIN) {
    waiting = false; clearRound();
    $("live").style.display = "none";
    lastImpact = performance.now();
    plays--; hud();
    document.body.className = "";
    $("big").classList.remove("on");
    $("why").textContent = "Table knock, ignored.";
    setTimeout(function(){ if (!waiting) $("why").textContent = ""; }, 1600);
    return;
  }

  waiting = false; clearRound();
  $("live").style.display = "none";
  lastImpact = performance.now();

  /* No contact at all is no evidence either way. Something hit the phone and
     nothing was ever seen leaving it, so assume it stayed. */
  /* A second thump right after the first means it left and landed elsewhere.
     That is evidence, so it outranks the guess. */
  var flewOff = secondHit > 0;
  /* Held at the end, or still being felt late, is proof it stayed. That beats
     everything. Otherwise any contact at all counts, unless a second thump says
     it left. The cutoff is now only a tiebreaker, not the main test. */
  var certain = down > 0 || (lastContact && lastContact - roundT0 >= LATE_FROM);
  var guessed = !lastContact && !flewOff;
  /* Held at the end, or felt late once the buzzing has started, is proof it is
     sitting there. A brief touch at the moment of impact and nothing after is
     what a bounce looks like, so that is the only case the thump decides. */
  /* A contact that brushed the glass and was gone, before the buzzing even
     started, is a bounce. That comes from the screen, not from guessing at
     what the accelerometer heard. */
  var heldMs = (liftAt && firstContactAt) ? liftAt - firstContactAt : 0;
  var brief = lastContact > 0 && down === 0 && heldMs > 0 && heldMs < BRIEF_MS
              && (lastContact - roundT0) < BUZZ_AT[0];
  var on = certain || !(flewOff || brief);
  var slid = firstPos && lastPos &&
             Math.hypot(lastPos.x - firstPos.x, lastPos.y - firstPos.y) > 12;

  if (on) {
    wins++;
    /* Where it first came down is the truest reading. Anything after that is
       the packet being nudged by the buzzing, or the screen re-acquiring it a
       little off, so a win is scored at the point of impact. */
    var where = guessed ? "unknown" : target(firstPx);
    var got = where === "hole" ? 3 : where === "outside" ? 0 : 1;
    points += got; scores[turn] += got;
    if (got > 0) bumpScore();
    document.body.className = got === 3 ? "three" : got === 0 ? "lose" : "win";
    $("bigText").textContent = got === 3 ? "CORNHOLE" : got === 0 ? "MISS" : String(got);
    $("big").classList.toggle("huge", got === 3 || got === 0);
    if (got === 3) celebrate(); else if (got === 0) boo();
    /* a dot is a bag resting on the board, so only a scoring one earns it,
       and only when the screen actually told us where it came down */
    /* every point puts a bag on the board. if the screen never gave us a spot,
       it goes mid board as a dashed one so the count always matches. */
    if (got > 0) {
      if (firstPos && !guessed) {
        plot(firstPos, where === "hole", false);
      } else {
        /* No spot yet. Park it mid board and move it the moment the screen
           finally feels the packet, which is what the white ring is showing. */
        plot({ x: 50, y: 64 }, false, true);
        pendingDot = lastDot;
        pendingUntil = performance.now() + PENDING_MS;
      }
    }
    $("why").textContent =
        where === "hole"    ? "In the hole."
      : where === "outside" ? "On the phone but off the board. No points."
      : guessed             ? "Never showed on screen, but it landed square. One point."
                            : "On the board in " + zone(firstPos) + ".";
  } else {
    document.body.className = "lose";
    $("bigText").textContent = "MISS";
    $("big").classList.add("huge");
    boo();
    appealUntil = performance.now() + APPEAL_MS;
    $("why").textContent = flewOff
      ? "Touched " + zone(firstPos) + ", then landed somewhere else. Bounced off."
      : brief ? "Only on the glass for " + Math.round(heldMs) + "ms. Bounced off."
      : slid  ? "Hit " + zone(firstPos) + ", slid off the edge."
              : "Touched " + zone(firstPos) + " and was gone. Bounced off.";
  }
  $("big").classList.add("on");
  hud();
  if (on && document.body.className === "win") beep(760, 100);
  bagsLeft--;
  hud();
  if (bagsLeft <= 0) rt(endFrame, 1700); else rt(idle, 1500);
}

/* ---- sensors ---- */
function motion(ax, ay, az){
  var m = Math.sqrt(ax*ax + ay*ay + az*az);
  if (waiting) {
    var age = performance.now() - roundT0;
    /* mark that the phone actually settled after the landing, rather than
       demanding a silence quieter than the sensor's own noise floor */
    if (age > BLANK_MS && m < Math.max(0.05, ACC_THR * 0.35)) settled = true;
    /* Landing on the table arrives through the table top, heavily damped, so
       it is always much softer than the direct hit. Listen well below the
       trigger, but still demand a fresh transient rather than ringdown. */
    if (!secondHit && settled && age < LISTEN_MS
        && m > Math.max(0.05, ACC_THR * 0.35)) secondHit = m;
    return;                       // a round in flight is never restarted
  }
  if (m > ACC_THR) onImpact(m, Math.abs(az) / m);
}


function startMotion(){
  if (window.LinearAccelerationSensor) {
    try {
      var a = new LinearAccelerationSensor({frequency:200});
      a.onreading = function(){ motion(a.x, a.y, a.z); };
      a.onerror = dm; a.start(); return;
    } catch(e){}
  }
  dm();
}
function dm(){
  function bind(){
    addEventListener("devicemotion", function(e){
      var a = e.acceleration;
      if (!a || a.x === null) return;
      motion(a.x||0, a.y||0, a.z||0);
    });
  }
  if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission)
    DeviceMotionEvent.requestPermission().then(bind).catch(function(){});
  else bind();
}

/* ---- touch ---- */
function contact(t){
  lastContact = performance.now();
  lastPos = { x: +(t.clientX/innerWidth*100).toFixed(1),
              y: +(t.clientY/innerHeight*100).toFixed(1) };
  lastPx = { x: t.clientX, y: t.clientY };
  if (!firstPos) { firstPos = lastPos; firstPx = lastPx; firstContactAt = lastContact; }
  if (!waiting && performance.now() < appealUntil) appeal(lastPx, lastPos);
  else if (!waiting && pendingDot && performance.now() < pendingUntil) placeBag(lastPx, lastPos);
  var lv = $("live");
  lv.style.left = t.clientX + "px"; lv.style.top = t.clientY + "px";
  lv.style.display = waiting ? "block" : "none";
}
document.addEventListener("touchstart", function(e){
  if (e.target.tagName === "BUTTON" || e.target.closest("#install") || e.target.closest("#start") || e.target.closest("#confirm")) return;
  e.preventDefault();
  down = e.touches.length;
  if (!waiting) lastTouchStart = performance.now();
  var t0 = e.changedTouches[0];
  touchOrigin = { x: t0.clientX, y: t0.clientY }; touchMoved = 0;
  contact(t0);
}, {passive:false});
document.addEventListener("touchmove", function(e){
  if (e.target.tagName === "BUTTON" || e.target.closest("#install") || e.target.closest("#start") || e.target.closest("#confirm")) return;
  e.preventDefault();
  var t = e.changedTouches[0];
  if (touchOrigin) {
    var d = Math.hypot(t.clientX - touchOrigin.x, t.clientY - touchOrigin.y);
    if (d > touchMoved) touchMoved = d;
  }
  if (waiting) contact(t);
}, {passive:false});
function lift(e){
  if (e.target.tagName === "BUTTON" || e.target.closest("#install") || e.target.closest("#start") || e.target.closest("#confirm")) return;
  e.preventDefault();
  down = e.touches.length;
  /* A packet being lifted drags across the glass on the way up, and that jolt
     would otherwise open a fresh round and score the same bag twice. A packet
     the screen simply lost never moves, so it does not blind anything. */
  if (down === 0 && waiting) liftAt = performance.now();
  if (down === 0 && touchMoved > PICKUP_PX) {
    deafUntil = Math.max(deafUntil, performance.now() + PICKUP_TAIL);
    appealUntil = 0;
  }
  if (down === 0) { touchOrigin = null; touchMoved = 0; }
}
document.addEventListener("touchend", lift, {passive:false});
document.addEventListener("touchcancel", lift, {passive:false});

/* ---- corners ---- */
if ("serviceWorker" in navigator)
  addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" })
      .then(function(reg){ reg.update(); })
      .catch(function(){});
    var reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if (reloaded) return;
      reloaded = true;
      location.reload();          // a new build took over, show it straight away
    });
  });

document.addEventListener("DOMContentLoaded", function(){
  var b = $("dismiss");
  if (!b) return;
  b.addEventListener("click", function(e){
    e.stopPropagation();
    dismissed = true;
    try { localStorage.setItem("packet-install-dismissed", "1"); } catch(err){}
    $("install").classList.remove("on");
  });
});

function goFullscreen(){
  var el = document.documentElement;
  var fs = el.requestFullscreen || el.webkitRequestFullscreen;
  if (fs) { try { var p = fs.call(el); if (p && p.then) p.then(checkChrome, checkChrome); } catch(err){} }
  setTimeout(checkChrome, 400);
}
checkChrome();

function resume(){
  paused = false;
  $("start").classList.add("gone");
  deafUntil = performance.now() + ARM_QUIET;
  lastTouchStart = performance.now();
  idle();
}
$("m1").addEventListener("click", function(e){ e.stopPropagation(); startGame(1); });
$("m2").addEventListener("click", function(e){ e.stopPropagation(); startGame(2); });
$("startTap").addEventListener("click", function(e){ e.stopPropagation(); resume(); });

function exitGame(){
  goFullscreen();
  $("dots").innerHTML = ""; lastDot = null; pendingDot = null; pendingUntil = 0;
  frame = 1; bagsLeft = BAGS; frameStart = 0;
  scores = [0, 0]; turn = 0; paused = false;
  $("startTitle").innerHTML = "Pocket<br>Cornhole";
  $("startBody").textContent = "Lay the phone flat, screen up. Throw a foil-wrapped sugar packet at it.";
  $("startFoot").textContent = "Then hands off the phone for a moment.";
  $("modes").classList.remove("hide");
  $("startTap").classList.add("hide");
  $("start").classList.remove("gone");
  wins = 0; plays = 0; points = 0; hud();
  $("why").textContent = "";
}

/* Exiting throws away the score, so it asks first. */
$("clear").addEventListener("click", function(e){
  e.stopPropagation();
  var mid = plays > 0 || scores[0] > 0 || scores[1] > 0;
  if (!mid) { exitGame(); return; }
  $("confirmBody").textContent = players === 2
    ? "Player 1 has " + scores[0] + ", Player 2 has " + scores[1] + ". Both go back to zero."
    : "You are on " + scores[0] + (scores[0] === 1 ? " point." : " points.") + " That goes back to zero.";
  $("confirm").classList.add("on");
});
$("confirmYes").addEventListener("click", function(e){
  e.stopPropagation();
  $("confirm").classList.remove("on");
  exitGame();
});
$("confirmNo").addEventListener("click", function(e){
  e.stopPropagation();
  $("confirm").classList.remove("on");
});

})();
</script>
</body>
